<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · 엔진 정밀도 테스트</title>
<style>
  body{background:#0F0F11;color:#F2F2F0;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px;margin:0}
  h1{font-size:15px;letter-spacing:.02em}
  pre{white-space:pre-wrap;word-break:break-word}
  .ok{color:#4FBE86}.ng{color:#D8576E}
</style>
</head>
<body>
<h1>Prehealth · 자세 엔진 정밀도 테스트 (3D·가시성·One-Euro·레벨)</h1>
<pre id="out">index.html에서 엔진을 불러오는 중…</pre>
<script>
window.addEventListener('error', function (e) {
  document.getElementById('out').textContent =
    'ERROR: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || '');
});
window.addEventListener('unhandledrejection', function (e) {
  document.getElementById('out').textContent = 'REJECT: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
});
</script>
<script type="module">
const outEl = document.getElementById('out');
const lines = [];
function say(s) { lines.push(s); outEl.textContent = lines.join('\n'); }
let fails = 0;
function ok(cond, msg) {
  if (!cond) fails++;
  lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg);
  outEl.innerHTML = lines.map(function (l) {
    return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
  }).join('\n');
}

/* index.html에서 순수 분석 코어를 그대로 떼어와 모듈로 평가한다 */
const html = await (await fetch('../index.html?v=' + Date.now(), { cache: 'no-store' })).text();
const a = html.lastIndexOf('/*', html.indexOf('CORE START'));
const b = html.lastIndexOf('/*', html.indexOf('CORE END'));
if (a < 0 || b < 0) { say('index.html에서 CORE 블록을 찾지 못했습니다'); throw new Error('no core'); }
const EXPORTS = 'export { createEngine, LEVELS, RUN, TUNE, EXERCISES, COPY, angleAt, leanFromVertical, bodyLine, createOneEuro, oneEuroAlpha, valgusMeasure, overstride, assessQuality, sayCopy, buildRecord, recordStats, recordStreak, dateKeyOf, clockText };';
const src = html.slice(a, b) + EXPORTS;
const mod = await import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
say('코어 로드 완료 · 운동 ' + Object.keys(mod.EXERCISES).join(', ') + ' · 레벨 ' + Object.keys(mod.LEVELS).join(', '));
say('');

/* CASES START — tests/engine.html 과 로컬 하네스가 함께 쓰는 검증 케이스 */
function runCases(M, ok, say){
  const createEngine = M.createEngine, LEVELS = M.LEVELS, TUNE = M.TUNE, EXERCISES = M.EXERCISES;
  const angleAt = M.angleAt, createOneEuro = M.createOneEuro, bodyLine = M.bodyLine;
  const valgusMeasure = M.valgusMeasure, overstride = M.overstride, assessQuality = M.assessQuality;
  const sayCopy = M.sayCopy, COPY = M.COPY, leanFromVertical = M.leanFromVertical;
  const buildRecord = M.buildRecord, recordStats = M.recordStats, recordStreak = M.recordStreak, clockText = M.clockText;
  const RUN = M.RUN;
  const FPS = 30, DT = 1000 / FPS;

  function P33(){ return new Array(33).fill(null); }
  function put(L, i, x, y, v){ L[i] = { x: x, y: y, z: 0, visibility: v === undefined ? 0.92 : v }; }
  function codesOf(sum){ return sum.issues.map(function(i){ return i.code; }); }
  function has(sum, code){ return codesOf(sum).indexOf(code) >= 0; }
  function firstEvent(sum, code){
    for (let i = 0; i < sum.events.length; i++){ if (sum.events[i].code === code) return sum.events[i]; }
    return null;
  }

  /* ================= 합성 포즈 ================= */
  const TORSO = 0.20, L1 = 0.17, L2 = 0.17;

  /* 측면 러닝 (기존 회귀용) */
  function runner(o){
    const L = P33();
    const lean = (o.lean === undefined ? 8 : o.lean) * Math.PI / 180;
    const hipY = o.hipY === undefined ? 0.52 : o.hipY;
    const hip = { x: 0.48, y: hipY };
    const sh = { x: hip.x + TORSO * Math.sin(lean), y: hip.y - TORSO * Math.cos(lean) };
    put(L, 11, sh.x + 0.012, sh.y + 0.004); put(L, 12, sh.x - 0.012, sh.y + 0.004);
    put(L, 23, hip.x + 0.012, hip.y); put(L, 24, hip.x - 0.012, hip.y);
    const drive = o.drive === undefined ? 1 : o.drive;
    for (let leg = 0; leg < 2; leg++){
      const f = (o.fase + leg * 0.5) % 1;
      const swing = Math.max(0, Math.sin(Math.PI * f));
      const A = (12 + 62 * drive * swing) * Math.PI / 180;
      const kneeAng = 170 - 110 * swing;
      const B = A + (180 - kneeAng) * Math.PI / 180;
      const off = leg === 0 ? 0.012 : -0.012;
      const hp = { x: hip.x + off, y: hip.y };
      const knee = { x: hp.x + L1 * Math.sin(A), y: hp.y + L1 * Math.cos(A) };
      const ank = { x: knee.x + L2 * Math.sin(B), y: knee.y + L2 * Math.cos(B) };
      const ids = leg === 0 ? [23, 25, 27, 31] : [24, 26, 28, 32];
      put(L, ids[0], hp.x, hp.y);
      put(L, ids[1], knee.x, knee.y);
      put(L, ids[2], ank.x, ank.y);
      put(L, ids[3], ank.x + 0.04, ank.y + 0.012);
    }
    const elbow = o.elbow === undefined ? 92 : o.elbow;
    for (let s = 0; s < 2; s++){
      const ids = s === 0 ? [11, 13, 15] : [12, 14, 16];
      const shp = L[ids[0]];
      const el = { x: shp.x - 0.015, y: shp.y + 0.105 };
      const dx = shp.x - el.x, dy = shp.y - el.y;
      const n = Math.hypot(dx, dy) || 1;
      const t = elbow * Math.PI / 180;
      const ux = dx / n, uy = dy / n;
      const vx = ux * Math.cos(t) - uy * Math.sin(t);
      const vy = ux * Math.sin(t) + uy * Math.cos(t);
      put(L, ids[1], el.x, el.y);
      put(L, ids[2], el.x + 0.09 * vx, el.y + 0.09 * vy);
    }
    put(L, 0, sh.x + 0.03, sh.y - 0.05);
    return L;
  }
  function simulate(kind, opts, seconds){
    const eng = createEngine(kind);
    const frames = Math.round(seconds * FPS);
    let last = null;
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const fase = (i / FPS) / (opts.period || 0.7);
      last = eng.update(runner({ fase: fase, lean: opts.lean, elbow: opts.elbow, drive: opts.drive,
        hipY: (opts.hipY === undefined ? 0.52 : opts.hipY) +
          (opts.bounceAmp || 0) * Math.sin(2 * Math.PI * (opts.bounceHz || 1.6) * (i / FPS)) }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* 측면 스쿼트: 무릎 각도 k(도)·상체 기울기·정강이 기울기를 그대로 재현 */
  function squatPose(o){
    const L = P33();
    const k = (o.knee === undefined ? 168 : o.knee);
    const lean = (o.lean === undefined ? 12 : o.lean) * Math.PI / 180;
    const shinT = (o.shin === undefined ? 12 : o.shin) * Math.PI / 180;
    const ank = { x: 0.50, y: 0.84 };
    const KN = { x: ank.x + 0.17 * Math.sin(shinT), y: ank.y - 0.17 * Math.cos(shinT) };
    const dx = ank.x - KN.x, dy = ank.y - KN.y, n = Math.hypot(dx, dy) || 1;
    const ux = dx / n, uy = dy / n, th = k * Math.PI / 180;
    const hx = ux * Math.cos(th) - uy * Math.sin(th);
    const hy = ux * Math.sin(th) + uy * Math.cos(th);
    const hip = { x: KN.x + 0.18 * hx, y: KN.y + 0.18 * hy };
    const sh = { x: hip.x + 0.22 * Math.sin(lean), y: hip.y - 0.22 * Math.cos(lean) };
    const off = 0.010;
    put(L, 11, sh.x + off, sh.y); put(L, 12, sh.x - off, sh.y);
    put(L, 13, sh.x + off - 0.02, sh.y + 0.10); put(L, 14, sh.x - off - 0.02, sh.y + 0.10);
    put(L, 15, sh.x + off - 0.02, sh.y + 0.18); put(L, 16, sh.x - off - 0.02, sh.y + 0.18);
    put(L, 23, hip.x + off, hip.y); put(L, 24, hip.x - off, hip.y);
    put(L, 25, KN.x + off, KN.y); put(L, 26, KN.x - off, KN.y);
    put(L, 27, ank.x + off, ank.y); put(L, 28, ank.x - off, ank.y);
    put(L, 31, ank.x + 0.045, ank.y + 0.006); put(L, 32, ank.x - 0.005, ank.y + 0.006);
    put(L, 0, sh.x + 0.02, sh.y - 0.085);
    return L;
  }
  /* 정면 스쿼트: 골반 폭은 있는데 무릎이 중앙선 쪽으로 말리는 자세. d=0 직립 ~ d=1 깊은 앉기 */
  function squatFrontPose(o){
    const L = P33();
    const d = (o.d === undefined ? 1 : o.d);
    const inward = (o.inward === undefined ? 0.075 : o.inward);   // 무릎이 안쪽으로 들어온 정도
    const hipY = 0.50 + 0.16 * d;
    const kneeY = 0.68 + 0.10 * d;
    const ankY = 0.86;
    for (let s = 0; s < 2; s++){
      const sign = s === 0 ? 1 : -1;
      const hx = 0.5 + sign * 0.115;
      const kx = 0.5 + sign * (0.115 - inward * d);
      const ax = 0.5 + sign * 0.125;
      put(L, 23 + s, hx, hipY); put(L, 25 + s, kx, kneeY); put(L, 27 + s, ax, ankY);
      put(L, 31 + s, ax + sign * 0.02, ankY + 0.01);
    }
    const shY = hipY - 0.16;
    put(L, 11, 0.5 + 0.10, shY); put(L, 12, 0.5 - 0.10, shY);
    put(L, 13, 0.5 + 0.13, shY + 0.09); put(L, 14, 0.5 - 0.13, shY + 0.09);
    put(L, 15, 0.5 + 0.14, shY + 0.17); put(L, 16, 0.5 - 0.14, shY + 0.17);
    put(L, 0, 0.5, shY - 0.09);
    return L;
  }
  /* 스쿼트 시퀀스: 직립 → 하강 → 바닥 유지 → 상승 (레벨·깊이 테스트용) */
  function simSquat(level, target, opts){
    const o = opts || {};
    const eng = createEngine('squat', level);
    const reps = o.reps || 2, perRep = 2.6;
    const total = reps * perRep;
    const frames = Math.round(total * FPS);
    let last = null, hints = [], knees = [];
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const f = ((i / FPS) % perRep) / perRep;
      let knee;
      if (f < 0.15) knee = 168;
      else if (f < 0.42) knee = 168 + (target - 168) * smooth((f - 0.15) / 0.27);
      else if (f < 0.68) knee = target;
      else if (f < 0.90) knee = target + (168 - target) * smooth((f - 0.68) / 0.22);
      else knee = 168;
      last = eng.update(squatPose({ knee: knee, lean: o.lean, shin: o.shin }), 1.0, t);
      if (last && last.ok){ hints.push(last.hint); knees.push(knee); }
    }
    let hintAtBottom = null, minK = 999;
    for (let i = 0; i < knees.length; i++){
      if (knees[i] < minK){ minK = knees[i]; hintAtBottom = hints[i]; }
    }
    return { last: last, sum: eng.summary(), hintAtBottom: hintAtBottom };
  }

  /* 측면 푸시업 */
  function pushPose(o){
    const L = P33();
    const th = (o.elbow === undefined ? 168 : o.elbow);
    const el = { x: 0.50, y: 0.70 }, wr = { x: 0.56, y: 0.83 };
    const dx = wr.x - el.x, dy = wr.y - el.y, n = Math.hypot(dx, dy) || 1;
    const ux = dx / n, uy = dy / n, t = th * Math.PI / 180;
    const vx = ux * Math.cos(t) - uy * Math.sin(t);
    const vy = ux * Math.sin(t) + uy * Math.cos(t);
    const sh = { x: el.x + 0.16 * vx, y: el.y + 0.16 * vy };
    const bx = 0.96, by = 0.28, bn = Math.hypot(bx, by);
    const ux2 = bx / bn, uy2 = by / bn;
    const hip = { x: sh.x + 0.30 * ux2, y: sh.y + 0.30 * uy2 + (o.sag || 0) };
    const ank = { x: sh.x + 0.80 * ux2, y: sh.y + 0.80 * uy2 };
    const off = 0.010;
    put(L, 11, sh.x, sh.y + off); put(L, 12, sh.x, sh.y - off);
    put(L, 13, el.x, el.y + off); put(L, 14, el.x, el.y - off);
    put(L, 15, wr.x, wr.y + off); put(L, 16, wr.x, wr.y - off);
    put(L, 23, hip.x, hip.y + off); put(L, 24, hip.x, hip.y - off);
    put(L, 25, hip.x + 0.30 * ux2, hip.y + 0.30 * uy2 + off);
    put(L, 26, hip.x + 0.30 * ux2, hip.y + 0.30 * uy2 - off);
    put(L, 27, ank.x, ank.y + off); put(L, 28, ank.x, ank.y - off);
    put(L, 31, ank.x + 0.03, ank.y + 0.012); put(L, 32, ank.x - 0.01, ank.y + 0.012);
    put(L, 0, sh.x + 0.03, sh.y - 0.085 + (o.noseDy || 0));
    return L;
  }
  function simPush(level, top, bottom, opts){
    const o = opts || {};
    const eng = createEngine('pushup', level);
    const reps = o.reps || 2, perRep = 2.6;
    const frames = Math.round(reps * perRep * FPS);
    let last = null;
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const f = ((i / FPS) % perRep) / perRep;
      let e;
      if (f < 0.15) e = top;
      else if (f < 0.42) e = top + (bottom - top) * smooth((f - 0.15) / 0.27);
      else if (f < 0.68) e = bottom;
      else if (f < 0.90) e = bottom + (top - bottom) * smooth((f - 0.68) / 0.22);
      else e = top;
      last = eng.update(pushPose({ elbow: e, sag: o.sag, noseDy: o.noseDy }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* 측면 플랭크 */
  function plankPose(o){
    const L = P33();
    const sh = { x: 0.34, y: 0.62 + (o.shDy || 0) };
    const hip = { x: 0.56, y: 0.62 + (o.hipDy || 0) };
    const ank = { x: 0.80, y: 0.62 };
    const off = 0.010;
    put(L, 11, sh.x, sh.y + off); put(L, 12, sh.x, sh.y - off);
    put(L, 23, hip.x, hip.y + off); put(L, 24, hip.x, hip.y - off);
    put(L, 27, ank.x, ank.y + off); put(L, 28, ank.x, ank.y - off);
    put(L, 31, ank.x + 0.04, ank.y); put(L, 32, ank.x + 0.02, ank.y);
    put(L, 13, sh.x + 0.005, sh.y + 0.13); put(L, 14, sh.x - 0.005, sh.y + 0.13);
    put(L, 15, sh.x + 0.02, sh.y + 0.18); put(L, 16, sh.x - 0.02, sh.y + 0.18);
    put(L, 0, sh.x + 0.03, sh.y - 0.05 + (o.noseDy || 0));
    return L;
  }
  function simPlank(level, seconds, opts){
    const o = opts || {};
    const eng = createEngine('plank', level);
    const frames = Math.round(seconds * FPS);
    let last = null;
    for (let i = 0; i < frames; i++){
      last = eng.update(plankPose(o), 1.0, Math.round(i * DT));
    }
    return { last: last, sum: eng.summary() };
  }

  /* ================= 1) 좋은 러닝 (회귀) ================= */
  say('▸ 1. 좋은 러닝 (4초, 0.7초 주기)');
  const good = simulate('running', { lean: 9, elbow: 92, drive: 1, period: 0.7 }, 4);
  say('   steps=' + good.sum.reps + ' cadence=' + good.sum.cadence + ' avg=' + good.sum.avgScore +
      ' issues=' + JSON.stringify(good.sum.issues.map(function(i){ return i.code + ':' + i.count; })));
  ok(good.sum.reps >= 9 && good.sum.reps <= 13, '스텝 카운트 9~13 (실제 ' + good.sum.reps + ')');
  ok(good.sum.cadence >= 150 && good.sum.cadence <= 195, '케이던스 150~195 spm (실제 ' + good.sum.cadence + ')');
  ok(good.sum.avgScore >= 80, '평균 점수 ≥ 80 (실제 ' + good.sum.avgScore + ')');
  ok(good.sum.events.length > 0, '피드백 이벤트 기록됨');
  ok(good.last.ok === true && good.last.cadence > 0, '마지막 프레임 ok + cadence 노출');
  ok(!has(good.sum, 'run_lean_back') && !has(good.sum, 'run_arm_straight'), '좋은 자세에는 상체/팔 교정 없음');

  /* ================= 2) 나쁜 러닝 ================= */
  say('');
  say('▸ 2. 나쁜 러닝 (뒤로 젖힘 · 팔 펴짐 · 무릎 낮음)');
  const bad = simulate('running', { lean: -8, elbow: 158, drive: 0.2, period: 0.7 }, 4);
  say('   steps=' + bad.sum.reps + ' avg=' + bad.sum.avgScore);
  ok(has(bad.sum, 'run_lean_back') || has(bad.sum, 'run_lean_back_mid'), '뒤로 젖힌 상체 감지');
  ok(has(bad.sum, 'run_arm_straight'), '너무 펴진 팔꿈치 감지');
  ok(has(bad.sum, 'run_drive_low'), '무릎 드라이브 부족 감지');
  ok(bad.sum.avgScore < 85, '나쁜 자세 평균 점수 < 85 (실제 ' + bad.sum.avgScore + ')');

  /* ================= 3) 과숙임 ================= */
  say('');
  say('▸ 3. 상체 과숙임 (32°)');
  const bent = simulate('running', { lean: 32, elbow: 92, drive: 1, period: 0.7 }, 3);
  ok(has(bent.sum, 'run_lean_bent'), '과하게 숙인 상체 감지 (' + codesOf(bent.sum).join(',') + ')');

  /* ================= 4) 바운스 ================= */
  say('');
  say('▸ 4. 상하 바운스');
  const bRun = simulate('running', { lean: 8, elbow: 92, drive: 1, period: 0.7 }, 4);
  const bUp = simulate('running', { lean: 8, elbow: 92, drive: 1, period: 0.7, bounceAmp: 0.035, bounceHz: 1.7 }, 4);
  say('   안정=' + bRun.sum.bounceAmp.toFixed(3) + ' 흔들림=' + bUp.sum.bounceAmp.toFixed(3));
  ok(bRun.sum.bounceAmp < bUp.sum.bounceAmp, '정지 러닝 < 흔들리는 러닝 바운스');
  ok(has(bUp.sum, 'run_bounce') || has(bUp.sum, 'run_bounce_mid'), '상하 흔들림 교정 포인트 생성');

  /* ================= 5) 사람 없음 회귀 ================= */
  say('');
  say('▸ 5. 사람 없음 회귀');
  const sq0 = createEngine('squat'), pu0 = createEngine('pushup'), pl0 = createEngine('plank'), ru0 = createEngine('running');
  ok(sq0.update(null, 1.0, 0).ok === false, '스쿼트: 사람 없음 → ok:false');
  ok(pu0.update(null, 1.0, 0).ok === false, '푸시업: 사람 없음 → ok:false');
  ok(pl0.update(null, 1.0, 0).ok === false, '플랭크: 사람 없음 → ok:false');
  ok(ru0.update(null, 1.0, 0).ok === false, '러닝: 사람 없음 → ok:false');
  ok(sq0.summary().reps === 0 && ru0.summary().reps === 0 && ru0.summary().cadence === 0, '초기 카운트 0');

  /* ================= 6) 기록·스트릭 (회귀) ================= */
  say('');
  say('▸ 6. 내 기록 · 스트릭');
  const NOW = new Date(2026, 10, 16, 21, 0, 0).getTime();
  function recDay(offset, score, kind){
    const d = new Date(2026, 10, 16, 9, 0, 0);
    d.setDate(d.getDate() - offset);
    return { id: 'r' + offset, date: d.toISOString(), exercise: kind || 'squat',
      exerciseName: '스쿼트', metricLabel: '반복', metricValue: '10', score: score,
      durationSec: 40, topFeedback: '교정 포인트 없음', comment: '' };
  }
  const recs = [recDay(0, 80), recDay(1, 90), recDay(1, 70), recDay(3, 60)];
  const rst = recordStats(recs, NOW);
  ok(rst.total === 4 && rst.streak === 2 && rst.avgScore === 75 && rst.bestScore === 90, '기록 통계 4건·2일·평균75·최고90');
  ok(rst.week.length === 7 && rst.week[6].isToday === true && rst.week[6].avgScore === 80, '7일 윈도우·오늘 평균 80');
  ok(rst.week[5].count === 2 && rst.week[5].avgScore === 80, '어제 2건·평균 80');

  say('');

  const fq = createOneEuro({ minCutoff: 1.25, beta: 0.03 });
  let iStd = 0, oStd = 0;
  const inSeq = [], outSeq = [];
  let seed = 7;
  const rnd = function(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  for (let i = 0; i < 180; i++){
    const noise = (rnd() - 0.5) * 1.2;         // ±0.6° 정지 떨림
    const raw = 100 + noise;
    const val = fq(raw, i * DT);
    if (i > 60){ inSeq.push(raw); outSeq.push(val); }
  }
  const std = function(arr){
    let m = 0; for (let i = 0; i < arr.length; i++) m += arr[i];
    m /= arr.length;
    let s = 0; for (let i = 0; i < arr.length; i++) s += (arr[i] - m) * (arr[i] - m);
    return Math.sqrt(s / arr.length);
  };
  iStd = std(inSeq); oStd = std(outSeq);
  say('   입력 표준편차=' + iStd.toFixed(3) + ' 출력=' + oStd.toFixed(3));
  ok(oStd < iStd * 0.6, '정지 떨림 억제 · 출력이 입력의 60% 미만 (실제 ' + (oStd / iStd * 100).toFixed(0) + '%)');

  const ff = createOneEuro({ minCutoff: 1.6, beta: 0.04 });
  let maxOut = -Infinity, lagSum = 0, lagN = 0, lastIn = 0, lastOut = 0;

    if (i > 60){ if (val > maxOut) maxOut = val; lagSum += Math.abs(raw - val); lagN++; }

  }

  /* ================= 22-26) 신규 4종 (런지·턱걸이·데드리프트·윗몸일으키기) ================= */
  /* 같은 무릎 각도·상체 각도를 반복하는 합성 동작 (스쿼트 포즈 재사용) */
  function simKnee(kind, level, top, bottom, opts){
    const o = opts || {};
    const eng = createEngine(kind, level);
    const reps = o.reps || 2, perRep = o.perRep || 3;
    const frames = Math.round(reps * perRep * FPS);
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    let last = null;
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const f = ((i / FPS) % perRep) / perRep;
      let v;
      if (f < 0.15) v = top;
      else if (f < 0.40) v = top + (bottom - top) * smooth((f - 0.15) / 0.25);
      else if (f < 0.58) v = bottom;
      else if (f < 0.82) v = bottom + (top - bottom) * smooth((f - 0.58) / 0.24);
      else v = top;
      last = eng.update(squatPose({ knee: v, lean: o.lean, shin: o.shin }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* 매달린 자세: 손목은 고정, 팔꿈치 각도에 따라 어깨·몸통이 올라온다 */
  function pullPose(o){
    const L = P33();
    const th = (o.elbow === undefined ? 175 : o.elbow);
    const a = 0.135;
    const d = a * Math.sqrt(Math.max(0.04, 2 - 2 * Math.cos(th * Math.PI / 180)));
    const wr = { x: 0.50, y: 0.12 };
    const sh = { x: 0.50, y: wr.y + d };
    const h = Math.sqrt(Math.max(0, a * a - (d / 2) * (d / 2)));
    const el = { x: 0.50 + h, y: wr.y + d / 2 };
    const hip = { x: sh.x, y: sh.y + 0.20 };
    const knee = { x: hip.x, y: hip.y + 0.17 };
    const ank = { x: knee.x, y: knee.y + 0.17 };
    const off = 0.010;
    put(L, 11, sh.x, sh.y + off); put(L, 12, sh.x, sh.y - off);
    put(L, 13, el.x, el.y + off); put(L, 14, el.x, el.y - off);
    put(L, 15, wr.x, wr.y + off); put(L, 16, wr.x, wr.y - off);
    put(L, 23, hip.x, hip.y + off); put(L, 24, hip.x, hip.y - off);
    put(L, 25, knee.x + off, knee.y); put(L, 26, knee.x - off, knee.y);
    put(L, 27, ank.x + off, ank.y); put(L, 28, ank.x - off, ank.y);
    put(L, 0, sh.x - 0.03, sh.y - 0.085 + (o.headDy || 0));
    return L;
  }
  function simPull(level, bottom, top){
    const eng = createEngine('pullup', level);
    const perRep = 3, reps = 2;
    const frames = Math.round(reps * perRep * FPS);
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    let last = null;
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const f = ((i / FPS) % perRep) / perRep;
      let e;
      if (f < 0.20) e = top;
      else if (f < 0.45) e = top + (bottom - top) * smooth((f - 0.20) / 0.25);
      else if (f < 0.55) e = bottom;
      else if (f < 0.85) e = bottom + (top - bottom) * smooth((f - 0.55) / 0.30);
      else e = top;
      last = eng.update(pullPose({ elbow: e }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* 측면 데드리프트: 상체 숙임(힌지)과 무릎 굽힘을 함께 움직인다 */
  function deadPose(o){
    const L = P33();
    const lean = (o.lean === undefined ? 6 : o.lean) * Math.PI / 180;
    const k = (o.knee === undefined ? 172 : o.knee);
    const shinT = 8 * Math.PI / 180;
    const ank = { x: 0.50, y: 0.86 };
    const KN = { x: ank.x + 0.17 * Math.sin(shinT), y: ank.y - 0.17 * Math.cos(shinT) };
    const dx = ank.x - KN.x, dy = ank.y - KN.y, n = Math.hypot(dx, dy) || 1;
    const ux = dx / n, uy = dy / n, th = k * Math.PI / 180;
    const hx = ux * Math.cos(th) - uy * Math.sin(th);
    const hy = ux * Math.sin(th) + uy * Math.cos(th);
    const hip = { x: KN.x + 0.19 * hx, y: KN.y + 0.19 * hy };
    const sh = { x: hip.x + 0.22 * Math.sin(lean), y: hip.y - 0.22 * Math.cos(lean) };
    const dir = { x: Math.sin(lean), y: -Math.cos(lean) };
    const nose = { x: sh.x + dir.x * 0.10, y: sh.y + dir.y * 0.10 + (o.headDy || 0) };
    const off = 0.010;
    put(L, 11, sh.x + off, sh.y); put(L, 12, sh.x - off, sh.y);
    put(L, 13, sh.x + off, sh.y + 0.10); put(L, 14, sh.x - off, sh.y + 0.10);
    put(L, 15, sh.x + off, sh.y + 0.18); put(L, 16, sh.x - off, sh.y + 0.18);
    put(L, 23, hip.x + off, hip.y); put(L, 24, hip.x - off, hip.y);
    put(L, 25, KN.x + off, KN.y); put(L, 26, KN.x - off, KN.y);
    put(L, 27, ank.x + off, ank.y); put(L, 28, ank.x - off, ank.y);
    put(L, 31, ank.x + 0.045, ank.y + 0.006); put(L, 32, ank.x - 0.005, ank.y + 0.006);
    put(L, 0, nose.x, nose.y);
    return L;
  }
  function simDead(level, leanBottom, opts){
    const o = opts || {};
    const KB = (o.kneeBottom === undefined ? 142 : o.kneeBottom);
    const eng = createEngine('deadlift', level);
    const reps = 2, perRep = 3.2;
    const frames = Math.round(reps * perRep * FPS);
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    let last = null;
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const f = ((i / FPS) % perRep) / perRep;
      let lean, knee;
      if (f < 0.15){ lean = 6; knee = 172; }
      else if (f < 0.40){ const p = smooth((f - 0.15) / 0.25); lean = 6 + (leanBottom - 6) * p; knee = 172 + (KB - 172) * p; }
      else if (f < 0.56){ lean = leanBottom; knee = KB; }
      else if (f < 0.82){ const p = smooth((f - 0.56) / 0.26); lean = leanBottom + (6 - leanBottom) * p; knee = KB + (172 - KB) * Math.min(1, p * 1.08); }
      else { lean = 6; knee = 172; }
      last = eng.update(deadPose({ lean: lean, knee: knee, headDy: o.headDy }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* 측면 윗몸일으키기: 등이 바닥과 이루는 각(phi)으로 몸통을 움직인다 */
  function sitPose(o){
    const L = P33();
    const phi = (o.torso === undefined ? 0 : o.torso) * Math.PI / 180;
    const psi = (o.thigh === undefined ? 40 : o.thigh) * Math.PI / 180;
    const hip = { x: 0.55, y: 0.64 };
    const dirT = { x: -Math.cos(phi), y: -Math.sin(phi) };
    const dirL = { x: Math.cos(psi), y: -Math.sin(psi) };
    const perp = { x: -Math.sin(phi), y: Math.cos(phi) };
    const sh = { x: hip.x + 0.22 * dirT.x, y: hip.y + 0.22 * dirT.y };
    const knee = { x: hip.x + 0.20 * dirL.x, y: hip.y + 0.20 * dirL.y };
    const ank = { x: knee.x + 0.03, y: hip.y + 0.26 };
    const hd = (o.headDy || 0);
    const nose = { x: sh.x + dirT.x * 0.10 + perp.x * hd, y: sh.y + dirT.y * 0.10 + perp.y * hd };
    const off = 0.010;
    put(L, 11, sh.x, sh.y + off); put(L, 12, sh.x, sh.y - off);
    put(L, 13, sh.x + 0.06, sh.y + 0.05); put(L, 14, sh.x - 0.06, sh.y + 0.05);
    put(L, 15, knee.x, knee.y); put(L, 16, knee.x, knee.y);
    put(L, 23, hip.x, hip.y + off); put(L, 24, hip.x, hip.y - off);
    put(L, 25, knee.x, knee.y + off); put(L, 26, knee.x, knee.y - off);
    put(L, 27, ank.x, ank.y); put(L, 28, ank.x, ank.y);
    put(L, 0, nose.x, nose.y);
    return L;
  }
  function simSit(level, flexMin, opts){
    const o = opts || {};
    const eng = createEngine('situp', level);
    const reps = 2, perRep = 3;
    const frames = Math.round(reps * perRep * FPS);
    const setUp = (o.riseSec === undefined ? 0.55 : o.riseSec);
    const smooth = function(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p))); };
    const phiMax = 140 - flexMin;
    let last = null;
    for (let i = 0; i < frames; i++){
      const t = Math.round(i * DT);
      const sec = (i / FPS) % perRep;
      let phi;
      const holdEnd = 1.0 + setUp + 0.4;
      if (sec < 1.0) phi = 0;
      else if (sec < 1.0 + setUp) phi = phiMax * smooth((sec - 1.0) / setUp);
      else if (sec < holdEnd) phi = phiMax;
      else if (sec < 2.8) phi = phiMax * (1 - smooth((sec - holdEnd) / (2.8 - holdEnd)));
      else phi = 0;
      last = eng.update(sitPose({ torso: phi, thigh: o.thigh, headDy: o.headDy }), 1.0, t);
    }
    return { last: last, sum: eng.summary() };
  }

  /* ---- 22) 런지 ---- */
  say('');
  say('▸ 22. 런지 — 깊이 · 상체 쏠림 · 레벨');

  const lgShallowB = simKnee('lunge', 'beginner', 168, 110, {});

  /* ---- 23) 턱걸이 ---- */

  ok(!has(dl.sum, 'dead_back_round'), '등이 곧은 데드리프트는 등 지적 없음');
  ok(!has(dl.sum, 'dead_knee_bend'), '무릎을 살짝만 굽히면 지적 없음');
  ok(!has(dl.sum, 'dead_lockout'), '끝까지 일어서면 락아웃 지적 없음');
  const dlShort = simDead('beginner', 26);
  say('   얕은 힌지 issues=' + JSON.stringify(dlShort.sum.issues.map(function(i){ return i.code; })));
  ok(has(dlShort.sum, 'dead_hinge_short') || dlShort.sum.reps === 0, '엉덩이를 덜 뺀 동작 감지');
  const dlRound = simDead('beginner', 65, { headDy: 0.12 });
  say('   등 굽음 issues=' + JSON.stringify(dlRound.sum.issues.map(function(i){ return i.code; })));
  ok(has(dlRound.sum, 'dead_back_round'), '등이 굽은 자세 감지');
  const dlKnee = simDead('beginner', 60, { kneeBottom: 92 });
  say('   무릎 굽힘 issues=' + JSON.stringify(dlKnee.sum.issues.map(function(i){ return i.code; })));
  ok(has(dlKnee.sum, 'dead_knee_bend'), '무릎을 많이 굽힌(스쿼트 같은) 자세 감지');

  /* ---- 25) 윗몸일으키기 ---- */
  say('');
  say('▸ 25. 윗몸일으키기 — 각도 · 목 · 반동');
  const su = simSit('beginner', 70);

  ok(su.sum.reps === 2, '윗몸일으키기 2회 카운트 (실제 ' + su.sum.reps + ')');
  ok(!has(su.sum, 'sit_depth'), '끝까지 일어나면 각도 지적 없음');
  ok(!has(su.sum, 'sit_momentum'), '천천히 올라오면 반동 지적 없음');
  const suShallowB = simSit('beginner', 95);
  ok(has(suShallowB.sum, 'sit_depth'), '덜 일어난 동작 감지');
  const suShallowA = simSit('advanced', 95);
  ok(suShallowA.sum.reps === 0, '헬창은 95°를 횟수로 세지 않음 (실제 ' + suShallowA.sum.reps + ')');
  const suNeck = simSit('beginner', 70, { headDy: 0.09 });
  say('   목 꺾임 issues=' + JSON.stringify(suNeck.sum.issues.map(function(i){ return i.code; })));
  ok(has(suNeck.sum, 'sit_neck'), '목을 꺾은 자세 감지');
  const suFast = simSit('beginner', 70, { riseSec: 0.18 });
  say('   빠른 반동 issues=' + JSON.stringify(suFast.sum.issues.map(function(i){ return i.code; })));
  ok(has(suFast.sum, 'sit_momentum'), '반동으로 올라온 동작 감지');

  /* ---- 26) 새 종목 기록 연동 ---- */
  say('');
  say('▸ 26. 새 4종 기록 · 카드 연동');
  const NEW4 = ['lunge', 'pullup', 'deadlift', 'situp'];
  ok(Object.keys(EXERCISES).length === 8, '운동 8종 등록 (' + Object.keys(EXERCISES).join(',') + ')');
  ok(NEW4.every(function(k){ return !!(LEVELS.beginner[k] && LEVELS.advanced[k]); }), '새 4종 모두 헬린이·헬창 기준 있음');
  ok(NEW4.every(function(k){ return !!COPY[{ lunge: 'lunge_ok', pullup: 'pull_ok', deadlift: 'dead_ok', situp: 'sit_ok' }[k]]; }), '새 4종 모두 좋은 자세 문구 있음');
  let recOk = true, nameOk = true;
  NEW4.forEach(function(k){
    const r = buildRecord({ reps: 8, avgScore: 81, durationMs: 30000, frames: 200, issues: [] }, k, NOW);
    if (!(r.metricLabel === '반복' && r.metricValue === '8' && r.score === 81)) recOk = false;
    if (r.exerciseName !== EXERCISES[k].name) nameOk = false;
  });
  ok(recOk, '새 4종도 기록(반복·점수)으로 저장');
  ok(nameOk, '기록 이름이 운동 이름과 같음');
  const noOne = NEW4.map(function(k){ return createEngine(k).update(null, 1.0, 0).ok; });
  ok(noOne.every(function(v){ return v === false; }), '새 4종도 사람이 없으면 ok:false');
}
/* CASES END */
runCases(mod, ok, say);

lines.push(fails ? 'RESULT: FAIL (' + fails + '건)' : 'RESULT: ALL PASS');
outEl.innerHTML = lines.map(function (l) {
  return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
}).join('\n');
document.title = fails ? 'FAIL' : 'ALL PASS';
</script>
</body>
