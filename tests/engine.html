<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · 엔진 스모크 테스트</title>
<style>
  body{background:#141416;color:#F5F2EB;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px;margin:0}
  h1{font-size:15px;letter-spacing:.02em}
  pre{white-space:pre-wrap;word-break:break-word}
  .ok{color:#3FD37A}.ng{color:#FF3B62}
</style>
</head>
<body>
<h1>Prehealth · 자세 엔진 스모크 테스트</h1>
<pre id="out">index.html에서 엔진을 불러오는 중…</pre>
<script>
window.addEventListener('error', function (e) {
  document.getElementById('out').textContent =
    'ERROR: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || '');
});
window.addEventListener('unhandledrejection', function (e) {
  document.getElementById('out').textContent = 'REJECT: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
});
</script>
<script type="module">
const LF = String.fromCharCode(10);
const outEl = document.getElementById('out');
const lines = [];
function say(s) { lines.push(s); outEl.textContent = lines.join('\n'); }
let fails = 0;
function ok(cond, msg) {
  if (!cond) fails++;
  lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg);
  outEl.innerHTML = lines.map(function (l) {
    return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
  }).join('\n');
}

/* index.html에서 순수 분석 코어를 그대로 떼어와 모듈로 평가한다 */
const html = await (await fetch('../index.html?v=' + Date.now(), { cache: 'no-store' })).text();
const a = html.lastIndexOf('/*', html.indexOf('CORE START'));
const b = html.lastIndexOf('/*', html.indexOf('CORE END'));
if (a < 0 || b < 0) { say('index.html에서 CORE 블록을 찾지 못했습니다'); throw new Error('no core'); }
const src = html.slice(a, b) + 'export { createEngine, RUN, EXERCISES, angleAt, torsoLean, buildRecord, recordStats, recordStreak, dateKeyOf, clockText };';
const mod = await import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
const createEngine = mod.createEngine, RUN = mod.RUN, EXERCISES = mod.EXERCISES;
const buildRecord = mod.buildRecord, recordStats = mod.recordStats, recordStreak = mod.recordStreak, clockText = mod.clockText;
say('코어 로드 완료 · 운동 ' + Object.keys(EXERCISES).join(', '));
say('');

/* ---------- 합성 포즈 ---------- */
const TORSO = 0.20, L1 = 0.17, L2 = 0.17;
function P33() { return new Array(33).fill(null); }
function put(L, i, x, y, v) { L[i] = { x: x, y: y, z: 0, visibility: v === undefined ? 0.92 : v }; }

function runner(o) {
  const L = P33();
  const lean = (o.lean === undefined ? 8 : o.lean) * Math.PI / 180;
  const hipY = o.hipY === undefined ? 0.52 : o.hipY;
  const hip = { x: 0.48, y: hipY };
  const sh = { x: hip.x + TORSO * Math.sin(lean), y: hip.y - TORSO * Math.cos(lean) };
  put(L, 11, sh.x + 0.012, sh.y + 0.004); put(L, 12, sh.x - 0.012, sh.y + 0.004);
  put(L, 23, hip.x + 0.012, hip.y); put(L, 24, hip.x - 0.012, hip.y);
  const drive = o.drive === undefined ? 1 : o.drive;

  for (let leg = 0; leg < 2; leg++) {
    const f = (o.fase + leg * 0.5) % 1;
    const swing = Math.max(0, Math.sin(Math.PI * f));
    const A = (12 + 62 * drive * swing) * Math.PI / 180;
    const kneeAng = 170 - 110 * swing;
    const B = A + (180 - kneeAng) * Math.PI / 180;
    const off = leg === 0 ? 0.012 : -0.012;
    const hp = { x: hip.x + off, y: hip.y };
    const knee = { x: hp.x + L1 * Math.sin(A), y: hp.y + L1 * Math.cos(A) };
    const ank = { x: knee.x + L2 * Math.sin(B), y: knee.y + L2 * Math.cos(B) };
    const ids = leg === 0 ? [23, 25, 27, 31] : [24, 26, 28, 32];
    put(L, ids[0], hp.x, hp.y);
    put(L, ids[1], knee.x, knee.y);
    put(L, ids[2], ank.x, ank.y);
    put(L, ids[3], ank.x + 0.04, ank.y + 0.012);
  }
  const elbow = o.elbow === undefined ? 92 : o.elbow;
  for (let s = 0; s < 2; s++) {
    const ids = s === 0 ? [11, 13, 15] : [12, 14, 16];
    const shp = L[ids[0]];
    const el = { x: shp.x - 0.015, y: shp.y + 0.105 };
    const dx = shp.x - el.x, dy = shp.y - el.y;
    const n = Math.hypot(dx, dy) || 1;
    const t = elbow * Math.PI / 180;
    const ux = dx / n, uy = dy / n;
    const vx = ux * Math.cos(t) - uy * Math.sin(t);
    const vy = ux * Math.sin(t) + uy * Math.cos(t);
    put(L, ids[1], el.x, el.y);
    put(L, ids[2], el.x + 0.09 * vx, el.y + 0.09 * vy);
  }
  put(L, 0, sh.x + 0.03, sh.y - 0.05);
  return L;
}

const FPS = 30, DT = 1000 / FPS;
function simulate(kind, opts, seconds) {
  const eng = createEngine(kind);
  const frames = Math.round(seconds * FPS);
  let last = null;
  for (let i = 0; i < frames; i++) {
    const t = Math.round(i * DT);
    const fase = (i / FPS) / (opts.period || 0.7);
    last = eng.update(runner({ fase: fase, lean: opts.lean, elbow: opts.elbow, drive: opts.drive,
      hipY: (opts.hipY === undefined ? 0.52 : opts.hipY) +
        (opts.bounceAmp || 0) * Math.sin(2 * Math.PI * (opts.bounceHz || 1.6) * (i / FPS)) }), 1.0, t);
  }
  return { last: last, sum: eng.summary() };
}
const codesOf = function (sum) { return sum.issues.map(function (i) { return i.code; }); };

/* ---------- 1) 좋은 러닝 ---------- */
say('▸ 1. 좋은 러닝 (4초, 0.7초 주기)');
const good = simulate('running', { lean: 9, elbow: 92, drive: 1, period: 0.7 }, 4);
say('   steps=' + good.sum.reps + ' cadence=' + good.sum.cadence + ' avg=' + good.sum.avgScore +
    ' issues=' + JSON.stringify(good.sum.issues) + ' events=' + good.sum.events.length);
ok(good.sum.reps >= 9 && good.sum.reps <= 13, '스텝 카운트 9~13 (실제 ' + good.sum.reps + ')');
ok(good.sum.cadence >= 150 && good.sum.cadence <= 195, '케이던스 150~195 spm (실제 ' + good.sum.cadence + ')');
ok(good.sum.avgScore >= 80, '평균 점수 ≥ 80 (실제 ' + good.sum.avgScore + ')');
ok(good.sum.events.length > 0, '피드백 이벤트 기록됨');
ok(good.last.ok === true && good.last.cadence > 0, '마지막 프레임 ok + cadence 노출');
ok(codesOf(good.sum).indexOf('run_lean_back') < 0 && codesOf(good.sum).indexOf('run_arm_straight') < 0,
   '좋은 자세에는 상체/팔 교정 없음');
say('');

/* ---------- 2) 뒤로 젖힘 + 팔 펴짐 + 낮은 무릎 드라이브 ---------- */
say('▸ 2. 나쁜 러닝 (뒤로 젖힘 · 팔 펴짐 · 무릎 낮음)');
const bad = simulate('running', { lean: -8, elbow: 158, drive: 0.2, period: 0.7 }, 4);
say('   steps=' + bad.sum.reps + ' avg=' + bad.sum.avgScore + ' issues=' + JSON.stringify(bad.sum.issues));
const bc = codesOf(bad.sum);
ok(bc.indexOf('run_lean_back') >= 0 || bc.indexOf('run_lean_back_mid') >= 0, '뒤로 젖힌 상체 감지');
ok(bc.indexOf('run_arm_straight') >= 0, '너무 펴진 팔꿈치 감지');
ok(bc.indexOf('run_drive_low') >= 0, '무릎 드라이브 부족 감지');
ok(bad.sum.avgScore < 85, '나쁜 자세 평균 점수 < 85 (실제 ' + bad.sum.avgScore + ')');
say('');

/* ---------- 3) 과하게 숙임 ---------- */
say('▸ 3. 상체 과숙임 (32°)');
const bent = simulate('running', { lean: 32, elbow: 92, drive: 1, period: 0.7 }, 3);
ok(codesOf(bent.sum).indexOf('run_lean_bent') >= 0, '과하게 숙인 상체 감지 (' + codesOf(bent.sum).join(',') + ')');
say('');

/* ---------- 4) 바운스 ---------- */
say('▸ 4. 상하 바운스');
const bRun = simulate('running', { lean: 8, elbow: 92, drive: 1, period: 0.7 }, 4);
say('   안정 러닝 bounceAmp=' + bRun.sum.bounceAmp.toFixed(3));
ok(bRun.sum.bounceAmp >= 0 && bRun.sum.bounceAmp < RUN.bounceBad, '안정 러닝 바운스 < ' + RUN.bounceBad);
const bUp = simulate('running', { lean: 8, elbow: 92, drive: 1, period: 0.7, bounceAmp: 0.035, bounceHz: 1.7 }, 4);
say('   흔들리는 러닝 bounceAmp=' + bUp.sum.bounceAmp.toFixed(3) + ' issues=' + JSON.stringify(bUp.sum.issues));
ok(bUp.sum.bounceAmp >= RUN.bounceBad, '큰 흔들림 감지 (bounceAmp ' + bUp.sum.bounceAmp.toFixed(3) + ' ≥ ' + RUN.bounceBad + ')');
ok(codesOf(bUp.sum).indexOf('run_bounce') >= 0 || codesOf(bUp.sum).indexOf('run_bounce_mid') >= 0, '상하 흔들림 교정 포인트 생성');
say('');

/* ---------- 5) 기존 운동 회귀 ---------- */
say('▸ 5. 기존 운동 회귀');
const sq = createEngine('squat'), pu = createEngine('pushup'), pl = createEngine('plank'), ru = createEngine('running');
ok(sq.update(null, 1.0, 0).ok === false, '스쿼트: 사람 없음 → ok:false');
ok(pu.update(null, 1.0, 0).ok === false, '푸시업: 사람 없음 → ok:false');
ok(pl.update(null, 1.0, 0).ok === false, '플랭크: 사람 없음 → ok:false');
ok(ru.update(null, 1.0, 0).ok === false, '러닝: 사람 없음 → ok:false');
ok(sq.summary().reps === 0 && ru.summary().reps === 0 && ru.summary().cadence === 0, '초기 카운트 0');
say('');

/* ---------- 6) 내 기록 · 스트릭 (순수 계산) ---------- */
say('▸ 6. 내 기록 · 스트릭');
const NOW = new Date(2026, 10, 16, 21, 0, 0).getTime();   // 2026-11-16 21:00 로컬
function recDay(offset, score, kind) {
  const d = new Date(2026, 10, 16, 9, 0, 0);
  d.setDate(d.getDate() - offset);
  return { id: 'r' + offset, date: d.toISOString(), exercise: kind || 'squat',
    exerciseName: '스쿼트', metricLabel: '반복', metricValue: '10', score: score,
    durationSec: 40, topFeedback: '교정 포인트 없음', comment: '' };
}
const recs = [recDay(0, 80), recDay(1, 90), recDay(1, 70), recDay(3, 60)];
const rst = recordStats(recs, NOW);
say('   total=' + rst.total + ' streak=' + rst.streak + ' avg=' + rst.avgScore +
    ' week=' + JSON.stringify(rst.week.map(function (d) { return d.avgScore; })));
ok(rst.total === 4, '총 기록 4건 (실제 ' + rst.total + ')');
ok(rst.streak === 2, '오늘+어제 연속 = 2일 (실제 ' + rst.streak + ')');
ok(rst.avgScore === 75, '평균 점수 75 (실제 ' + rst.avgScore + ')');
ok(rst.bestScore === 90, '최고 점수 90 (실제 ' + rst.bestScore + ')');
ok(rst.week.length === 7 && rst.week[6].isToday === true, '7일 윈도우 · 마지막이 오늘');
ok(rst.week[6].count === 1 && rst.week[6].avgScore === 80, '오늘 1건 · 평균 80');
ok(rst.week[5].count === 2 && rst.week[5].avgScore === 80, '어제 2건 · 평균 80 (실제 ' + JSON.stringify(rst.week[5]) + ')');
ok(rst.week[3].avgScore === 60 && rst.week[4].count === 0, '3일 전 1건 · 2일 전 공백');
ok(recordStreak([recDay(1, 80), recDay(2, 80)], NOW) === 2, '오늘 기록 없어도 어제까지 2일 연속');
ok(recordStreak([recDay(2, 80)], NOW) === 0, '이틀 전에서 끊긴 스트릭 = 0');
ok(recordStreak([], NOW) === 0 && recordStats([], NOW).avgScore === null, '빈 기록 안전');

const sqRec = buildRecord({ reps: 12, avgScore: 87, durationMs: 42000, frames: 400,
  issues: [{ code: 'squat_depth_mid', label: '깊이 살짝 부족', count: 2 }, { code: 'squat_ok', label: '좋은 반복', count: 3 }] }, 'squat', NOW);
ok(sqRec.metricLabel === '반복' && sqRec.metricValue === '12', '스쿼트 → 반복 12');
ok(sqRec.score === 87 && sqRec.durationSec === 42 && sqRec.exerciseName === '스쿼트', '점수·시간·종목 저장');
ok(sqRec.topFeedback === '깊이 살짝 부족 ×2', '대표 교정 포인트 (실제 ' + sqRec.topFeedback + ')');
ok(!!sqRec.id && !!Date.parse(sqRec.date), 'id · date 생성');
const plRec = buildRecord({ reps: null, holdMs: 32000, score: 91, durationMs: 33000, frames: 500, issues: [] }, 'plank', NOW);
ok(plRec.metricLabel === '유지 시간' && plRec.metricValue === '0:32' && plRec.score === 91, '플랭크 → 유지 시간 0:32');
ok(clockText(32000) === '0:32' && clockText(59000) === '0:59', 'clockText 표기');
const runRec = buildRecord({ reps: 18, avgScore: 84, durationMs: 60000, frames: 900,
  issues: [{ code: 'run_ok', label: '좋은 스텝', count: 5 }] }, 'running', NOW);
ok(runRec.metricLabel === '스텝' && runRec.metricValue === '18' && runRec.topFeedback === '좋은 자세 유지', '러닝 → 스텝 18 · 교정 없음 표기');
say('');

lines.push(fails ? 'RESULT: FAIL (' + fails + '건)' : 'RESULT: ALL PASS');
outEl.innerHTML = lines.map(function (l) {
  return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
}).join('\n');
document.title = fails ? 'FAIL' : 'ALL PASS';
</script>
</body>
</html>
