<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · 모바일 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#08080A;display:flex;justify-content:center}
  iframe{width:390px;height:844px;border:0;display:block;background:#0F0F11}
  body{background:#08080A}
  #cap{position:fixed;left:14px;bottom:12px;color:#4A4A52;font:12px/1.4 ui-monospace,Menlo,monospace;pointer-events:none}
</style>
</head>
<body>
<!-- 앱을 폰 폭(390px)으로 띄워 보는 확인용 페이지.
     ?demo=1 을 붙이면 스크린샷용 예시 기록을 채운다.
     캐시된 옛 index.html이 뜨지 않도록 항상 새 쿼리로 불러온다. -->
<iframe id="app" title="Prehealth 미리보기"></iframe>
<div id="cap">Prehealth v14 · 폰 폭 미리보기 (?demo=1&amp;full=1)</div>
<script>
(function(){
  const demo = /[?&]demo=1/.test(location.search);
  /* 캡처용: ?full=1 이면 폰 폭(390) 그대로 세로만 문서 전체 높이로 늘린다 —
     안쪽 스크롤바가 생기지 않아 전체 화면을 한 장으로 찍을 수 있다 */
  const full = /[?&]full=1/.test(location.search);
  const frame = document.getElementById('app');
  let seeded = false;
  frame.addEventListener('load', function(){
    if (seeded) return;
    const w = frame.contentWindow;
    const P = w && w.Prehealth;
    if (!P) return;
    seeded = true;
    if (!demo) return;
    function day(offset, hour){
      const d = new Date();
      d.setDate(d.getDate() - offset);
      d.setHours(hour, 12, 0, 0);
      return d.toISOString();
    }
    const rows = [
      { lv: 'advanced', off: 0, hour: 7, kind: 'squat', name: '스쿼트', label: '반복', value: '14', score: 88, dur: 46, fb: '조금 더 깊이 ×1', c: '자세가 아주 안정적이에요. 이 리듬 그대로 한 세트 더 가 볼까요?' },
      { off: 0, hour: 7, kind: 'plank', name: '플랭크', label: '유지 시간', value: '0:42', score: 92, dur: 44, fb: '좋은 자세 유지', c: '일직선이 아주 잘 유지됐어요. 시간을 조금씩 늘려 볼 차례예요.' },
      { lv: 'advanced', off: 1, hour: 21, kind: 'running', name: '러닝', label: '스텝', value: '26', score: 84, dur: 60, fb: '팔이 살짝 펴짐 ×4', c: '전반적으로 좋아요. 팔꿈치 각도만 잡으면 훨씬 가벼워져요.' },
      { off: 1, hour: 21, kind: 'pushup', name: '푸시업', label: '반복', value: '11', score: 79, dur: 38, fb: '조금 더 깊이 ×2', c: '기본은 잡혔어요. 가동범위를 조금만 더 확보해 볼까요?' },
      { off: 2, hour: 20, kind: 'squat', name: '스쿼트', label: '반복', value: '12', score: 71, dur: 41, fb: '상체가 조금 숙음 ×3', c: '가슴을 조금 더 세우면 점수가 확 올라가요.' },
      { off: 4, hour: 19, kind: 'plank', name: '플랭크', label: '유지 시간', value: '0:28', score: 66, dur: 30, fb: '엉덩이가 처짐 ×2', c: '시간을 줄이고 일직선을 먼저 잡아 볼까요?' }
    ];
    P.saveRecords(rows.map(function(r, i){
      return {
        id: 'demo' + i,
        date: day(r.off, r.hour),
        exercise: r.kind,
        exerciseName: r.name,
        metricLabel: r.label,
        metricValue: r.value,
        level: r.lv || 'beginner',
        levelName: (r.lv === 'advanced') ? '헬창' : '헬린이',
        levelEmoji: (r.lv === 'advanced') ? '🔥' : '🐣',
        score: r.score,
        durationSec: r.dur,
        topFeedback: r.fb,
        comment: r.c
      };
    }));
    P.renderRecords();
    if (full){
      setTimeout(function(){
        const doc = frame.contentDocument;
        // iOS처럼 오버레이 스크롤바: 캡처에서 회색 스크롤바가 폭을 차지하지 않게 한다
        doc.documentElement.style.scrollbarWidth = 'none';
        frame.style.height = Math.max(844, doc.documentElement.scrollHeight + 2) + 'px';
      }, 500);
    }
  });
  frame.src = '../index.html?t=' + Date.now();
})();
</script>
</body>
</html>
