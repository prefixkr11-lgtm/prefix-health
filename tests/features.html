<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · v6 기능 테스트 (기록·카드·Pro)</title>
<style>
  body{background:#141416;color:#F5F2EB;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px;margin:0}
  h1{font-size:15px;letter-spacing:.02em}
  pre{white-space:pre-wrap;word-break:break-word}
  .ok{color:#3FD37A}.ng{color:#FF3B62}
  iframe{width:390px;height:780px;border:1px solid #333;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<h1>Prehealth v6 · 기능 테스트 (기록 저장 / 결과 카드 PNG / Pro 모달)</h1>
<pre id="out">index.html을 불러오는 중…</pre>
<iframe id="app" src="../index.html" title="Prehealth 앱"></iframe>
<script>
const lines = [];
const outEl = document.getElementById('out');
let fails = 0;
function say(s){ lines.push(s); render(); }
function ok(cond, msg){
  if (!cond) fails++;
  lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg);
  render();
}
function render(){
  outEl.innerHTML = lines.map(function(l){
    return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
  }).join('\n');
}
function done(){
  lines.push(fails ? 'RESULT: FAIL (' + fails + '건)' : 'RESULT: ALL PASS');
  render();
  document.title = fails ? 'FAIL' : 'ALL PASS';
}

/* 앱 안에서 나는 에러를 모은다 */
const errors = [];
const frame = document.getElementById('app');
function watchErrors(win){
  win.addEventListener('error', function(e){
    errors.push('error: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  win.addEventListener('unhandledrejection', function(e){
    errors.push('reject: ' + (e.reason && (e.reason.message || e.reason)));
  });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function until(fn, timeoutMs, step){
  const t0 = Date.now();
  while (Date.now() - t0 < (timeoutMs || 20000)){
    try { const v = fn(); if (v) return v; } catch (e) {}
    await wait(step || 120);
  }
  return null;
}
function dayISO(offset){
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return d.toISOString();
}
function seed(offset, score, kind){
  return {
    id: 'seed' + offset + '-' + Math.random().toString(36).slice(2, 6),
    date: dayISO(offset), exercise: kind || 'squat', exerciseName: '스쿼트',
    metricLabel: '반복', metricValue: '12', score: score, durationSec: 41,
    topFeedback: '깊이 살짝 부족 ×2', comment: '전반적으로 좋아요. 교정 포인트 한두 개만 잡으면 훨씬 깔끔해져요.'
  };
}
function decodeImage(src){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('image decode failed')); };
    img.src = src;
  });
}

(async function run(){
  const app = await new Promise(function(resolve, reject){
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentWindow.Prehealth){
      return resolve(frame.contentWindow);
    }
    frame.addEventListener('load', function(){ resolve(frame.contentWindow); }, { once: true });
    setTimeout(function(){ reject(new Error('iframe load timeout')); }, 30000);
  }).catch(function(e){ say('FAIL  앱 로드: ' + e.message); return null; });
  if (!app) return done();
  watchErrors(app);
  const doc = app.document;

  const P = await until(function(){ return app.Prehealth; }, 30000);
  if (!P){ say('FAIL  window.Prehealth 공개 API를 찾지 못함'); return done(); }
  say('앱 로드 완료 · 버전 ' + P.version);
  say('');

  const q = function(sel){ return doc.querySelector(sel); };
  const txt = function(sel){ const el = q(sel); return el ? el.textContent.trim() : null; };

  /* ---------- 1) 기본 구조 ---------- */
  say('▸ 1. 화면 구조');
  ok(!!q('#proBadge'), '헤더에 PRO 배지 존재');
  ok(!!q('#proLock'), '리포트 안 Pro 잠금 카드 존재');
  ok(!!q('#repCard'), '리포트에 “결과 카드 저장” 버튼 존재');
  ok(!!q('#records') && !!q('#weekBars') && !!q('#recList'), '내 기록 섹션 구성');
  ok(q('#cardModal').hidden === true && q('#proModal').hidden === true, '모달은 처음에 닫혀 있음');
  ok(q('#proModal').textContent.indexOf('4,900') !== -1 && q('#proModal').textContent.indexOf('39,000') !== -1,
     'Pro 요금제 월 4,900 / 연 39,000 노출');
  ok(q('.top').classList.contains('rise') && doc.querySelectorAll('.rise').length >= 8,
     '메인 요소 순차 등장(stagger) 적용 (' + doc.querySelectorAll('.rise').length + '개)');
  const tSplash = Date.now();
  const gone = await until(function(){ return doc.getElementById('splash') === null; }, 2600, 50);
  ok(!!gone && (Date.now() - tSplash) < 1700,
     '진입 스플래시가 화면에서 사라짐 (' + (Date.now() - tSplash) + 'ms, null=' + (gone ? 'yes' : 'no') + ')');
  await wait(900);
  ok(app.getComputedStyle(q('.top')).opacity === '1', '등장 모션 후 요소가 보임');
  say('');

  /* ---------- 2) 기록 저장 · 통계 ---------- */
  say('▸ 2. 내 기록 저장 · 스트릭 · 7일 그래프');
  P.clearRecords();
  P.renderRecords();
  ok(txt('#recTotal') === '0' && txt('#recAvg') === '–', '초기 기록 비어 있음');
  ok(q('#weekBars').children.length === 7, '7일 바 그래프 7칸');
  ok((q('#recList').textContent || '').indexOf('아직 기록이 없어요') !== -1, '빈 상태 안내');

  P.saveRecords([seed(1, 90), seed(1, 70), seed(0, 80)]);
  P.renderRecords();
  ok(P.loadRecords().length === 3, 'localStorage에 3건 저장 (실제 ' + P.loadRecords().length + ')');
  ok(txt('#recTotal') === '3', '총 운동 3회 표시 (실제 ' + txt('#recTotal') + ')');
  ok(txt('#recStreak') === '2', '연속 2일 표시 (실제 ' + txt('#recStreak') + ')');
  ok(txt('#recAvg') === '80', '평균 점수 80 표시 (실제 ' + txt('#recAvg') + ')');
  const bars = Array.prototype.slice.call(q('#weekBars').children);
  ok(bars[6].classList.contains('today'), '오늘 칸 표시');
  ok(bars[6].textContent.indexOf('80') !== -1 && bars[5].textContent.indexOf('80') !== -1, '오늘/어제 막대에 평균 점수 표기');
  ok(bars[0].querySelector('.wc').className.indexOf('on') === -1, '기록 없는 날은 빈 막대');
  ok(q('#recList').querySelectorAll('.recRow').length === 3, '최근 기록 3줄');
  ok((q('#recList').textContent || '').indexOf('스쿼트') !== -1, '기록 줄에 종목 표시');

  /* 세션 리포트에 데이터가 없으면 기록을 만들지 않는다(중복/쓰레기 방지) */
  const before = P.loadRecords().length;
  P.showReport();
  ok(P.loadRecords().length === before, '데이터 없는 리포트는 기록을 추가하지 않음');
  q('#report').hidden = true;
  say('');

  /* ---------- 3) 기록 초기화 버튼 ---------- */
  say('▸ 3. 기록 초기화 (두 번 눌러 확인)');
  q('#recordsClear').click();
  ok(txt('#recordsClear') === '정말 지울까요?', '한 번 누르면 확인 문구');
  q('#recordsClear').click();
  ok(P.loadRecords().length === 0 && txt('#recTotal') === '0', '두 번째 클릭에 기록 삭제');
  ok(txt('#recordsClear') === '기록 초기화', '버튼 문구 원복');
  say('');

  /* ---------- 4) 결과 카드 PNG ---------- */
  say('▸ 4. 결과 카드 (1080×1350 PNG)');
  const rec = P.buildRecord({ reps: 12, avgScore: 87, durationMs: 42000, frames: 400,
    issues: [{ code: 'squat_depth_mid', label: '깊이 살짝 부족', count: 2 }] }, 'squat', Date.now());
  rec.comment = '전반적으로 좋아요. 교정 포인트 한두 개만 잡으면 훨씬 깔끔해져요.';
  const canvas = P.cardCanvas(rec);
  ok(canvas.width === 1080 && canvas.height === 1350, '캔버스 1080×1350 (실제 ' + canvas.width + '×' + canvas.height + ')');
  const url = P.cardDataUrl(rec);
  ok(url.indexOf('data:image/png;base64,') === 0, 'PNG data URL 생성');
  ok(url.length > 20000, '이미지 데이터 충분한 크기 (' + Math.round(url.length / 1024) + 'KB)');
  const img = await decodeImage(url).catch(function(){ return null; });
  ok(img && img.naturalWidth === 1080 && img.naturalHeight === 1350,
     'PNG 디코드 · 1080×1350 (실제 ' + (img ? img.naturalWidth + '×' + img.naturalHeight : 'fail') + ')');
  /* 캔버스 픽셀 확인: 코랄 로고 영역이 칠해져 있는지 */
  const g2 = canvas.getContext('2d');
  const px = g2.getImageData(132, 108, 1, 1).data;
  ok(px[0] > 180 && px[1] < 140, '코랄 로고 픽셀 그려짐 rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')');
  const pxBg = g2.getImageData(30, 700, 1, 1).data;
  ok(pxBg[0] < 40 && pxBg[1] < 40, '다크 배경 픽셀 rgb(' + pxBg[0] + ',' + pxBg[1] + ',' + pxBg[2] + ')');

  P.openCardModal(rec);
  ok(q('#cardModal').hidden === false, '카드 미리보기 모달 열림');
  ok(q('#cardPreview').getAttribute('src').indexOf('data:image/png') === 0, '미리보기 이미지 연결');
  ok((q('#cardDownload').getAttribute('href') || '').indexOf('data:image/png') === 0, '저장 버튼 href = PNG');
  ok(/^prehealth-\d{8}-squat\.png$/.test(q('#cardDownload').getAttribute('download')), '파일명 규칙 (' + q('#cardDownload').getAttribute('download') + ')');
  ok((q('#cardModal').textContent || '').indexOf('길게 눌러') !== -1, 'iOS 길게 눌러 저장 안내');
  P.closeCardModal();
  ok(q('#cardModal').hidden === true, '카드 모달 닫기');
  say('');

  /* ---------- 5) Pro 모달 ---------- */
  say('▸ 5. Prehealth Pro 모달');
  const startCount = P.proInterest();
  P.openPro();
  ok(q('#proModal').hidden === false, 'PRO 배지 → 모달 열림');
  ok((q('#proModal').textContent || '').indexOf('4,900') !== -1, '월 4,900원 표시');
  ok((q('#proModal').textContent || '').indexOf('39,000') !== -1, '연 39,000원 표시');
  ok(q('#proModal').querySelectorAll('.benefits li').length >= 3, '혜택 3가지 이상');
  ok(txt('#proCount') === String(startCount), '관심 카운트 초기값 표시 (' + txt('#proCount') + ')');
  q('#proCta').click();
  await wait(120);
  ok(P.proInterest() === startCount + 1, '결제 테스트 클릭 → 관심 카운트 +1 (' + P.proInterest() + ')');
  ok(q('#toast').classList.contains('show') && (q('#toast').textContent || '').indexOf('결제 연동 준비 중입니다') !== -1,
     '토스트 문구 노출: ' + (q('#toast').textContent || ''));
  ok(txt('#proCount') === String(startCount + 1), '모달 안 로컬 카운트 갱신');
  const yearly = q('.plan[data-plan="yearly"]');
  if (yearly){
    yearly.click();
    ok(yearly.getAttribute('aria-pressed') === 'true' && q('.plan[data-plan="monthly"]').getAttribute('aria-pressed') === 'false',
       '요금제 선택 전환');
  }
  q('#proClose').click();
  ok(q('#proModal').hidden === true, '모달 닫기');
  ok(q('#proBadge') && q('#fileInput') && !q('#repCard').disabled, '무료 기능(분석·리포트·카드)은 잠기지 않음');
  say('');

  /* ---------- 6) 콘솔 에러 ---------- */
  say('▸ 6. 에러 확인');
  const real = errors.filter(function(e){ return e && e.indexOf('ResizeObserver') === -1; });
  ok(real.length === 0, '앱에서 발생한 JS 에러 0건' + (real.length ? ' → ' + real.join(' | ') : ''));

  /* 테스트가 남긴 기록 정리 */
  P.clearRecords();
  P.closePro();
  P.closeCardModal();
  done();
})();
</script>
</body>
</html>
