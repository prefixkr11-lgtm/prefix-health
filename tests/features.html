<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · v14 기능 테스트 (플랫 스타일·기록·카드·Pro·레벨·일시정지·인트로)</title>
<style>
  body{background:#0F0F11;color:#F2F2F0;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px;margin:0}
  h1{font-size:15px;letter-spacing:.02em}
  pre{white-space:pre-wrap;word-break:break-word}
  .ok{color:#4FBE86}.ng{color:#D8576E}
  iframe{width:390px;height:780px;border:1px solid #333;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<h1>Prehealth v14 · 기능 테스트 (플랫·매트 스타일 / 기록 / 결과 카드 / Pro / 헬린이·헬창 / 카메라 일시정지 / 인트로)</h1>
<pre id="out">index.html을 불러오는 중…</pre>
<iframe id="app" src="../index.html" title="Prehealth 앱"></iframe>
<script>
const lines = [];
const outEl = document.getElementById('out');
let fails = 0;
function say(s){ lines.push(s); render(); }
function ok(cond, msg){
  if (!cond) fails++;
  lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg);
  render();
}
function render(){
  outEl.innerHTML = lines.map(function(l){
    return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
  }).join('\n');
}
function done(){
  lines.push(fails ? 'RESULT: FAIL (' + fails + '건)' : 'RESULT: ALL PASS');
  render();
  document.title = fails ? 'FAIL' : 'ALL PASS';
}

/* 앱 안에서 나는 에러를 모은다 */
const errors = [];
const frame = document.getElementById('app');
function watchErrors(win){
  win.addEventListener('error', function(e){
    errors.push('error: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  win.addEventListener('unhandledrejection', function(e){
    errors.push('reject: ' + (e.reason && (e.reason.message || e.reason)));
  });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
/* 앱 부팅 직후를 놓치지 않도록, 테스트 스크립트가 시작되는 순간부터 iframe 안의
   스플래시 DOM이 '처음 보인 시각'과 '사라진 시각'을 부모 시계로 잰다 (인트로 길이 검증용) */
const bootWatch = (function(){
  const t0 = performance.now();
  let seen = null, gone = null;
  return new Promise(function(resolve){
    const iv = setInterval(function(){
      let el = null, d = null;
      try { d = frame.contentDocument; } catch (e) {}
      try { el = d ? d.getElementById('splash') : null; } catch (e) {}
      if (seen === null && el) seen = performance.now();
      if (seen !== null && !el){
        clearInterval(iv);
        gone = performance.now();
        resolve({ seen: seen, gone: gone, waited: t0 });
      }
    }, 15);
    setTimeout(function(){ clearInterval(iv); resolve({ seen: seen, gone: gone, waited: t0 }); }, 12000);
  });
})();
async function until(fn, timeoutMs, step){
  const t0 = Date.now();
  while (Date.now() - t0 < (timeoutMs || 20000)){
    try { const v = fn(); if (v) return v; } catch (e) {}
    await wait(step || 120);
  }
  return null;
}
function dayISO(offset){
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return d.toISOString();
}
function seed(offset, score, kind){
  return {
    id: 'seed' + offset + '-' + Math.random().toString(36).slice(2, 6),
    date: dayISO(offset), exercise: kind || 'squat', exerciseName: '스쿼트',
    metricLabel: '반복', metricValue: '12', score: score, durationSec: 41,
    topFeedback: '깊이 살짝 부족 ×2', comment: '전반적으로 좋아요. 교정 포인트 한두 개만 잡으면 훨씬 깔끔해져요.'
  };
}
function decodeImage(src){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('image decode failed')); };
    img.src = src;
  });
}

(async function run(){
  const app = await new Promise(function(resolve, reject){
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentWindow.Prehealth){
      return resolve(frame.contentWindow);
    }
    frame.addEventListener('load', function(){ resolve(frame.contentWindow); }, { once: true });
    setTimeout(function(){ reject(new Error('iframe load timeout')); }, 30000);
  }).catch(function(e){ say('FAIL  앱 로드: ' + e.message); return null; });
  if (!app) return done();
  watchErrors(app);
  const doc = app.document;

  const P = await until(function(){ return app.Prehealth; }, 30000);
  if (!P){ say('FAIL  window.Prehealth 공개 API를 찾지 못함'); return done(); }
  say('앱 로드 완료 · 버전 ' + P.version);
  ok(P.version === 'v14', '공개 API 버전 v14 (실제 ' + P.version + ')');
  say('');

  const q = function(sel){ return doc.querySelector(sel); };
  const txt = function(sel){ const el = q(sel); return el ? el.textContent.trim() : null; };

  /* ---------- 1) 기본 구조 ---------- */
  say('▸ 1. 화면 구조');
  ok(!!q('#proBadge'), '헤더에 PRO 배지 존재');
  ok(!!q('#proLock'), '리포트 안 Pro 잠금 카드 존재');
  ok(!!q('#repCard'), '리포트에 “결과 카드 저장” 버튼 존재');
  ok(!!q('#records') && !!q('#weekBars') && !!q('#recList'), '내 기록 섹션 구성');
  ok(q('#cardModal').hidden === true && q('#proModal').hidden === true, '모달은 처음에 닫혀 있음');
  ok(q('#proModal').textContent.indexOf('4,900') !== -1 && q('#proModal').textContent.indexOf('39,000') !== -1,
     'Pro 요금제 월 4,900 / 연 39,000 노출');
  ok(q('.top').classList.contains('rise') && doc.querySelectorAll('.rise').length >= 8,
     '메인 요소 순차 등장(stagger) 적용 (' + doc.querySelectorAll('.rise').length + '개)');
  /* v13 인트로: P(왼쪽 위)·H(오른쪽 아래)가 화면 밖에서 크게 날아와 'PH'로 합쳐지고 커튼처럼 위로 걷힌다 (~1.9초·글자만) */
  const sheet = doc.styleSheets[0];
  const rules = Array.prototype.slice.call(sheet.cssRules);
  const sel = function(selector){
    return rules.filter(function(r){ return r.selectorText === selector; })[0] || null;
  };
  const kf = {};
  rules.forEach(function(r){ if (r.name) kf[r.name] = r.cssText; });
  const durOf = function(el){ return el ? parseFloat(el.style.animationDuration) : NaN; };
  const delayOf = function(el){ return el ? parseFloat(el.style.animationDelay) : NaN; };
  const cssOf = function(el){ return el ? el.style.cssText : ''; };
  const sp = sel('.splash');
  const spPH = sel('.splashPH'), spP = sel('.splashP'), spH = sel('.splashH');
  const spWord = sel('.splashWord');
  ok(!!sp && sp.style.pointerEvents === 'none', '스플래시 레이어는 입력을 막지 않음 (pointer-events: none)');
  ok(txt('.splashP') === 'P' && txt('.splashH') === 'H', '합체 로고에 P·H 두 글자 존재');
  /* 네온/글로우 제거 확인: 섬광·퍼지는 링·글로우 레이어가 CSS에도 DOM에도 없다 */
  ok(!sel('.splashFlash') && !sel('.splashRing') && !sel('.splashGlow') && !kf.splashFlash && !kf.splashRing && !kf.splashGlow,
     '섬광(flash)·링(ring)·글로우 레이어와 키프레임 없음');
  ok(!q('.splashFlash') && !q('.splashRing') && !q('.splashGlow'),
     '스플래시 DOM에도 섬광·링·글로우 요소 없음');
  ok(!!spP && cssOf(spP).indexOf('text-shadow') === -1 && !!spH && cssOf(spH).indexOf('text-shadow') === -1,
     '글자에 네온 text-shadow 없음');
  /* v13: 배지 판(둥근 사각·원형 배경)을 걷어내고 순수 글자만 남겼는지 */
  ok(!sel('.splashPlate') && !sel('.splashBadge') && !kf.splashPlateIn && !kf.splashPlate,
     '배지 판(.splashPlate / .splashBadge) 규칙과 키프레임이 CSS에서 제거됨');
  ok(!q('.splashPlate') && !q('.splashBadge') && !!q('.splashPH') &&
     q('.splashPH').children.length === 2 && !q('.splashPH').children[0].children.length,
     '스플래시 DOM은 배지 박스 없이 P·H 글자만 (무대 자식 2개)');
  const propOf = function(rule, name, fallback){
    if (!rule) return '없음';
    const v = rule.style.getPropertyValue(name);
    return v ? v : (fallback || '');
  };
  const phBg = propOf(spPH, 'background-color');
  const phBgImg = propOf(spPH, 'background-image');
  ok(!!spPH && (phBgImg === '' || phBgImg === 'none') &&
     (phBg === '' || phBg === 'initial' || phBg === 'transparent' || phBg === 'rgba(0, 0, 0, 0)') &&
     propOf(spPH, 'border-top-width', '0px') === '0px' &&
     propOf(spPH, 'border-radius', '0px') === '0px' &&
     propOf(spPH, 'padding-top', '0px') === '0px' &&
     propOf(spPH, 'box-shadow', 'none') === 'none',
     '합체 무대에 배경색·배경판·테두리·둥근 모서리·패딩·그림자 없음 — 순수 글자 (' +
     (spPH ? cssOf(spPH) : '없음') + ')');
  ok(!!spP && /#FFFFFF|rgb\(255,\s*255,\s*255\)/i.test(cssOf(spP)),
     'P는 화이트 글자 (' + (spP ? spP.style.color : '없음') + ')');
  ok(!!spH && /#6DB79B|#34D399|#10B981|rgb\((109,\s*183,\s*155|52,\s*211,\s*153|16,\s*185,\s*129)\)/i.test(cssOf(spH)),
     'H는 차분한 에메랄드 글자 (' + (spH ? spH.style.color : '없음') + ')');
  const spFont = spPH ? parseFloat(spPH.style.fontSize) : NaN;
  ok(spFont >= 64 && spFont <= 76, 'P·H 글자는 크게 64~76px (' + spFont + 'px)');
  ok(!!spPH && parseInt(spPH.style.fontWeight, 10) >= 800, 'P·H 글자는 굵고 단단한 타이포 (font-weight ' +
     (spPH ? spPH.style.fontWeight : '없음') + ')');
  ok(!!sp && /#0F0F11|rgb\(15,\s*15,\s*17\)/i.test(cssOf(sp)), '스플래시 배경은 플랫 다크(#0F0F11)');

  /* ---------- 1-2) v14: 앱 내부 전체가 플랫·매트 미니멀 (네온·글로우·그라데이션 0) ---------- */
  say('▸ 1-2. 플랫·매트 스타일 (네온·글로우·그라데이션 제거)');
  const cssAll = rules.map(function(r){ return r.cssText; }).join('\n');
  ok(cssAll.indexOf('box-shadow') === -1, '앱 스타일에 box-shadow 0건 — 빛번짐·그림자 글로우 없음');
  ok(cssAll.indexOf('text-shadow') === -1, '앱 스타일에 text-shadow 0건 — 네온 글자 없음');
  ok(cssAll.toLowerCase().indexOf('gradient') === -1, '앱 스타일에 그라데이션 0건 (배경·버튼·배지·막대 전부 단색)');
  /* 형광빛 밝은 에메랄드(#34D399 / #10B981)가 스타일 어디에도 남아 있지 않다 — 단, 카드 캔버스는 별도 검사 */
  ok(cssAll.indexOf('#34D399') === -1 && cssAll.indexOf('#10B981') === -1 &&
     cssAll.indexOf('52, 211, 153') === -1 && cssAll.indexOf('16, 185, 129') === -1,
     '형광 에메랄드(#34D399 / #10B981)가 스타일에서 사라짐');
  const rootCS = app.getComputedStyle(doc.documentElement);
  const tok = function(name){ return (rootCS.getPropertyValue(name) || '').trim(); };
  ok(tok('--bg') === '#0F0F11', '바탕 #0F0F11 (' + tok('--bg') + ')');
  ok(tok('--card') === '#161618', '카드 #161618 단색 (' + tok('--card') + ')');
  ok(tok('--line') === '#262629', '얇은 보더 #262629 (' + tok('--line') + ')');
  ok(tok('--emerald-2') === '#6DB79B', '차분한 에메랄드 포인트 #6DB79B (' + tok('--emerald-2') + ')');
  ok(tok('--emerald') === '#10664A', '딥 에메랄드 #10664A (' + tok('--emerald') + ')');
  const csOf = function(sel2){ const el = q(sel2); return el ? app.getComputedStyle(el) : null; };
  const blank = function(v){ return v === '' || v === 'none'; };
  const markCS = csOf('.brand .mark');
  ok(!!markCS && markCS.backgroundColor === 'rgb(16, 102, 74)' && blank(markCS.boxShadow) &&
     blank(markCS.backgroundImage),
     '헤더 [P] 배지는 플랫 단색 #10664A · 그림자 없음 (' + (markCS ? markCS.backgroundColor + ' / ' + markCS.boxShadow : '없음') + ')');
  const proCS = csOf('#proBadge');
  ok(!!proCS && proCS.borderTopWidth === '1px' && proCS.borderTopStyle === 'solid' &&
     blank(proCS.boxShadow) && blank(proCS.backgroundImage) && proCS.backgroundColor === 'rgba(0, 0, 0, 0)',
     'PRO 배지는 그라데이션·글로우 없는 테두리 필 (' + (proCS ? proCS.borderTopWidth + ' ' + proCS.borderTopStyle + ' ' + proCS.borderTopColor : '없음') + ')');
  /* 7일 막대: 단색 채움 — 실제 칠해진 색을 확인한다 (오늘 칸은 한 톤 밝은 단색) */
  const probe = doc.createElement('div');
  probe.className = 'wb today';
  probe.innerHTML = '<span class="wt"><i class="wc on" style="height:80%"></i></span><span class="wd">오늘</span>';
  q('#weekBars').appendChild(probe);
  const barCS = app.getComputedStyle(probe.querySelector('.wc'));
  const barBg = barCS.backgroundColor, barImg = barCS.backgroundImage, barShadow = barCS.boxShadow;
  probe.parentNode.removeChild(probe);
  ok(barBg === 'rgb(109, 183, 155)' && blank(barImg) && blank(barShadow),
     '7일 그래프 막대는 단색 에메랄드 채움 · 그라데이션·글로우 없음 (' + barBg + ' / ' + barImg + ')');
  const repCS = csOf('.report');
  ok(!!repCS && repCS.backgroundColor === 'rgb(18, 23, 20)' && blank(repCS.backgroundImage),
     '리포트 판은 단색 매트(#121714) (' + (repCS ? repCS.backgroundColor : '없음') + ')');
  /* 더 큰 출발 위치·스케일 */
  ok(!!kf.splashFlyP && /translate\(-36vw,\s*-30vh\)/.test(kf.splashFlyP) && /scale\(1\.8\)/.test(kf.splashFlyP) &&
     /rotate\(-14deg\)/.test(kf.splashFlyP) && /opacity:\s*0/.test(kf.splashFlyP),
     'P는 화면 왼쪽 위 바깥(-36vw, -30vh) · scale 1.8 · rotate -14deg · opacity 0에서 출발');
  ok(!!kf.splashFlyH && /translate\(36vw,\s*30vh\)/.test(kf.splashFlyH) && /scale\(1\.8\)/.test(kf.splashFlyH) &&
     /rotate\(14deg\)/.test(kf.splashFlyH) && /opacity:\s*0/.test(kf.splashFlyH),
     'H는 화면 오른쪽 아래 바깥(36vw, 30vh) · scale 1.8 · rotate 14deg · opacity 0에서 출발');
  ok(!!kf.splashFlyP && /translate\(0(px)?,\s*0(px)?\)/.test(kf.splashFlyP) && /scale\(1\)/.test(kf.splashFlyP) &&
     !!kf.splashFlyH && /translate\(0(px)?,\s*0(px)?\)/.test(kf.splashFlyH) && /scale\(1\)/.test(kf.splashFlyH),
     '두 글자 모두 중앙 제자리(translate 0,0 · scale 1)로 정확히 착지');
  ok(!!spP && spP.style.animationName === 'splashFlyP' && durOf(spP) === 0.85 && delayOf(spP) === 0 &&
     spP.style.animationTimingFunction.indexOf('cubic-bezier(0.22, 1, 0.36, 1)') !== -1,
     'P 비행 구간 0초~0.85초 · ease-out cubic-bezier(0.22, 1, 0.36, 1) (' +
     (spP ? spP.style.animationDuration + ' / ' + spP.style.animationDelay + ' / ' + spP.style.animationTimingFunction : '없음') + ')');
  ok(!!spH && spH.style.animationName === 'splashFlyH' && durOf(spH) === 0.85 && delayOf(spH) === 0 &&
     spH.style.animationTimingFunction.indexOf('cubic-bezier(0.22, 1, 0.36, 1)') !== -1,
     'H 비행 구간 0초~0.85초 · ease-out cubic-bezier(0.22, 1, 0.36, 1) (' +
     (spH ? spH.style.animationDuration + ' / ' + spH.style.animationDelay + ' / ' + spH.style.animationTimingFunction : '없음') + ')');
  /* 합체 탄성: 0.82초 시작, scale 1.12 → 1 */
  ok(!!kf.splashMerge && /scale\(1\.12\)/.test(kf.splashMerge) && /scale\(1\)/.test(kf.splashMerge) &&
     !!spPH && spPH.style.animationName === 'splashMerge' && delayOf(spPH) === 0.82 && durOf(spPH) === 0.36,
     '합체 순간 0.82초~1.18초 탄성 키프레임 (scale .86 → 1.12 → 1) (' +
     (spPH ? spPH.style.animationDelay + ' + ' + spPH.style.animationDuration : '없음') + ')');
  const atMerge = rules.filter(function(r){ return r.selectorText && r.style && r.style.animationDelay === '0.82s'; })
    .map(function(r){ return r.selectorText; });
  ok(atMerge.length === 1 && atMerge[0] === '.splashPH',
     '합체(0.82초)에 움직이는 것은 글자 무대(.splashPH) 하나뿐 — 배지 판 없음 (' + atMerge.join(', ') + ')');
  ok(!!spWord && spWord.style.animationName === 'splashWordIn' && delayOf(spWord) === 0.95 && spWord.style.opacity === '0',
     'Prehealth 워드마크는 합체 뒤 0.95초에 등장');
  /* 완성 로고 유지 구간: 워드마크 등장 끝(1.19초) ~ 커튼 시작(1.45초) */
  const wordEnd = (spWord ? delayOf(spWord) + durOf(spWord) : NaN);
  const curtainStart = (sp ? delayOf(sp) : NaN);
  ok(!!sp && wordEnd <= curtainStart && curtainStart - wordEnd >= 0.2,
     '완성 로고를 약 0.26초 유지한 뒤 커튼이 걷힘 (' + wordEnd.toFixed(2) + '초 → ' + curtainStart + '초)');
  ok(!!kf.splashCurtain && /translateY\(0px\)|translateY\(0\)/.test(kf.splashCurtain) && /translateY\(-100%\)/.test(kf.splashCurtain),
     '커튼 슬라이드업 키프레임 (translateY(0) → translateY(-100%))');
  ok(!!sp && sp.style.animationName === 'splashCurtain' && durOf(sp) === 0.45 && delayOf(sp) === 1.45 &&
     sp.style.animationTimingFunction.indexOf('cubic-bezier(0.22, 1, 0.36, 1)') !== -1,
     '커튼 구간 1.45초~1.90초 · ease-out cubic-bezier(0.22, 1, 0.36, 1) (' +
     (sp ? sp.style.animationDelay + ' + ' + sp.style.animationDuration + ' / ' + sp.style.animationTimingFunction : '없음') + ')');
  ok(!!sp && Math.abs((delayOf(sp) + durOf(sp)) - 1.9) < 0.001,
     '모션 총 길이 약 1.9초 (' + (sp ? (delayOf(sp) + durOf(sp)) : '?') + '초)');
  const mq = rules.filter(function(r){ return r.conditionText && r.conditionText.indexOf('prefers-reduced-motion') !== -1; })[0];
  const inMq = function(selector){
    if (!mq) return null;
    const found = Array.prototype.slice.call(mq.cssRules).filter(function(r){
      if (!r.selectorText) return false;
      return r.selectorText.split(',').map(function(s){ return s.trim(); }).indexOf(selector) !== -1;
    });
    return found[0] || null;
  };
  const mqSplash = inMq('.splash'), mqInner = inMq('.splashInner');
  const mqP = inMq('.splashP'), mqH = inMq('.splashH'), mqPH = inMq('.splashPH'), mqWord = inMq('.splashWord');
  ok(!!mq && !!mqSplash && mqSplash.style.animationName === 'none' &&
     !!mqInner && mqInner.style.animationName === 'none' &&
     !!mqP && mqP.style.animationName === 'none' &&
     !!mqH && mqH.style.animationName === 'none' &&
     !!mqPH && mqPH.style.animationName === 'none' &&
     !!mqWord && mqWord.style.animationName === 'none',
     'prefers-reduced-motion: reduce에서 인트로 모션 끔 (스플래시·비행·합체·워드마크)');
  /* DOM 제거 시점: 스플래시가 처음 그려진 때부터 약 1.96초 (2.6초 강제 정리보다 훨씬 앞) */
  const watch = await bootWatch;
  const shown = (watch.seen !== null && watch.gone !== null) ? Math.round(watch.gone - watch.seen) : null;
  ok(shown !== null, '진입 스플래시가 화면에 나타났다가 제거됨 (관측 ' + shown + 'ms)');
  ok(shown !== null && shown >= 1750 && shown <= 2250,
     '스플래시가 약 1.9초 모션 뒤에 제거됨 (' + shown + 'ms, 1900ms 예약 · 1960ms 제거)');
  ok(doc.getElementById('splash') === null, '테스트 시점에 스플래시 DOM이 남아 있지 않음');
  await wait(900);
  ok(app.getComputedStyle(q('.top')).opacity === '1', '등장 모션 후 요소가 보임');
  say('');

  /* ---------- 2) 기록 저장 · 통계 ---------- */
  say('▸ 2. 내 기록 저장 · 스트릭 · 7일 그래프');
  P.clearRecords();
  P.renderRecords();
  ok(txt('#recTotal') === '0' && txt('#recAvg') === '–', '초기 기록 비어 있음');
  ok(q('#weekBars').children.length === 7, '7일 바 그래프 7칸');
  ok((q('#recList').textContent || '').indexOf('아직 기록이 없어요') !== -1, '빈 상태 안내');

  P.saveRecords([seed(1, 90), seed(1, 70), seed(0, 80)]);
  P.renderRecords();
  ok(P.loadRecords().length === 3, 'localStorage에 3건 저장 (실제 ' + P.loadRecords().length + ')');
  ok(txt('#recTotal') === '3', '총 운동 3회 표시 (실제 ' + txt('#recTotal') + ')');
  ok(txt('#recStreak') === '2', '연속 2일 표시 (실제 ' + txt('#recStreak') + ')');
  ok(txt('#recAvg') === '80', '평균 점수 80 표시 (실제 ' + txt('#recAvg') + ')');
  const bars = Array.prototype.slice.call(q('#weekBars').children);
  ok(bars[6].classList.contains('today'), '오늘 칸 표시');
  ok(bars[6].textContent.indexOf('80') !== -1 && bars[5].textContent.indexOf('80') !== -1, '오늘/어제 막대에 평균 점수 표기');
  ok(bars[0].querySelector('.wc').className.indexOf('on') === -1, '기록 없는 날은 빈 막대');
  ok(q('#recList').querySelectorAll('.recRow').length === 3, '최근 기록 3줄');
  ok((q('#recList').textContent || '').indexOf('스쿼트') !== -1, '기록 줄에 종목 표시');

  /* 세션 리포트에 데이터가 없으면 기록을 만들지 않는다(중복/쓰레기 방지) */
  const before = P.loadRecords().length;
  P.showReport();
  ok(P.loadRecords().length === before, '데이터 없는 리포트는 기록을 추가하지 않음');
  q('#report').hidden = true;
  say('');

  /* ---------- 3) 기록 초기화 버튼 ---------- */
  say('▸ 3. 기록 초기화 (두 번 눌러 확인)');
  q('#recordsClear').click();
  ok(txt('#recordsClear') === '정말 지울까요?', '한 번 누르면 확인 문구');
  q('#recordsClear').click();
  ok(P.loadRecords().length === 0 && txt('#recTotal') === '0', '두 번째 클릭에 기록 삭제');
  ok(txt('#recordsClear') === '기록 초기화', '버튼 문구 원복');
  say('');

  /* ---------- 4) 결과 카드 PNG ---------- */
  say('▸ 4. 결과 카드 (1080×1350 PNG)');
  const rec = P.buildRecord({ reps: 12, avgScore: 87, durationMs: 42000, frames: 400,
    issues: [{ code: 'squat_depth_mid', label: '깊이 살짝 부족', count: 2 }] }, 'squat', Date.now());
  rec.comment = '전반적으로 좋아요. 교정 포인트 한두 개만 잡으면 훨씬 깔끔해져요.';
  const canvas = P.cardCanvas(rec);
  ok(canvas.width === 1080 && canvas.height === 1350, '캔버스 1080×1350 (실제 ' + canvas.width + '×' + canvas.height + ')');
  const url = P.cardDataUrl(rec);
  ok(url.indexOf('data:image/png;base64,') === 0, 'PNG data URL 생성');
  ok(url.length > 20000, '이미지 데이터 충분한 크기 (' + Math.round(url.length / 1024) + 'KB)');
  const img = await decodeImage(url).catch(function(){ return null; });
  ok(img && img.naturalWidth === 1080 && img.naturalHeight === 1350,
     'PNG 디코드 · 1080×1350 (실제 ' + (img ? img.naturalWidth + '×' + img.naturalHeight : 'fail') + ')');
  /* 캔버스 픽셀 확인: 에메랄드 로고 영역이 칠해져 있는지 (초록 우세) */
  const g2 = canvas.getContext('2d');
  const px = g2.getImageData(132, 108, 1, 1).data;
  ok(px[1] > 90 && px[1] > px[0] + 60 && px[2] > 40,
     '에메랄드 로고 픽셀 그려짐 rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')');
  const pxBg = g2.getImageData(30, 700, 1, 1).data;
  ok(pxBg[0] < 40 && pxBg[1] < 40, '다크 배경 픽셀 rgb(' + pxBg[0] + ',' + pxBg[1] + ',' + pxBg[2] + ')');
  /* v14: 카드도 플랫 — 상단 바는 단색, 바탕에는 빛번짐·그라데이션이 없다 */
  const bar1 = g2.getImageData(300, 4, 1, 1).data, bar2 = g2.getImageData(900, 4, 1, 1).data;
  ok(bar1[0] === bar2[0] && bar1[1] === bar2[1] && bar1[2] === bar2[2] && bar1[1] > bar1[0] + 40,
     '카드 상단 바 단색 에메랄드 · 그라데이션 없음 rgb(' + bar1[0] + ',' + bar1[1] + ',' + bar1[2] + ')');
  const mt1 = g2.getImageData(1020, 200, 1, 1).data, mt2 = g2.getImageData(30, 1300, 1, 1).data;
  ok(mt1[0] === 15 && mt1[1] === 15 && mt1[2] === 17 && mt2[0] === 15 && mt2[1] === 15 && mt2[2] === 17,
     '카드 바탕은 매트 다크(#0F0F11) 단색 — 우상단 빛번짐·하단 그라데이션 없음 rgb(' +
     mt1[0] + ',' + mt1[1] + ',' + mt1[2] + ') / rgb(' + mt2[0] + ',' + mt2[1] + ',' + mt2[2] + ')');

  P.openCardModal(rec);
  ok(q('#cardModal').hidden === false, '카드 미리보기 모달 열림');
  ok(q('#cardPreview').getAttribute('src').indexOf('data:image/png') === 0, '미리보기 이미지 연결');
  ok((q('#cardDownload').getAttribute('href') || '').indexOf('data:image/png') === 0, '저장 버튼 href = PNG');
  ok(/^prehealth-\d{8}-squat\.png$/.test(q('#cardDownload').getAttribute('download')), '파일명 규칙 (' + q('#cardDownload').getAttribute('download') + ')');
  ok((q('#cardModal').textContent || '').indexOf('길게 눌러') !== -1, 'iOS 길게 눌러 저장 안내');
  P.closeCardModal();
  ok(q('#cardModal').hidden === true, '카드 모달 닫기');
  say('');

  /* ---------- 5) Pro 모달 ---------- */
  say('▸ 5. Prehealth Pro 모달');
  const startCount = P.proInterest();
  P.openPro();
  ok(q('#proModal').hidden === false, 'PRO 배지 → 모달 열림');
  ok((q('#proModal').textContent || '').indexOf('4,900') !== -1, '월 4,900원 표시');
  ok((q('#proModal').textContent || '').indexOf('39,000') !== -1, '연 39,000원 표시');
  ok(q('#proModal').querySelectorAll('.benefits li').length >= 3, '혜택 3가지 이상');
  ok(txt('#proCount') === String(startCount), '관심 카운트 초기값 표시 (' + txt('#proCount') + ')');
  q('#proCta').click();
  await wait(120);
  ok(P.proInterest() === startCount + 1, '결제 테스트 클릭 → 관심 카운트 +1 (' + P.proInterest() + ')');
  ok(q('#toast').classList.contains('show') && (q('#toast').textContent || '').indexOf('결제 연동 준비 중입니다') !== -1,
     '토스트 문구 노출: ' + (q('#toast').textContent || ''));
  ok(txt('#proCount') === String(startCount + 1), '모달 안 로컬 카운트 갱신');
  const yearly = q('.plan[data-plan="yearly"]');
  if (yearly){
    yearly.click();
    ok(yearly.getAttribute('aria-pressed') === 'true' && q('.plan[data-plan="monthly"]').getAttribute('aria-pressed') === 'false',
       '요금제 선택 전환');
  }
  q('#proClose').click();
  ok(q('#proModal').hidden === true, '모달 닫기');
  ok(q('#proBadge') && q('#fileInput') && !q('#repCard').disabled, '무료 기능(분석·리포트·카드)은 잠기지 않음');
  say('');

  /* ---------- 6) 헬린이 / 헬창 레벨 모드 ---------- */
  say('▸ 6. 헬린이 / 헬창 레벨 모드');
  ok(!!q('.lv-btn[data-level="beginner"]') && !!q('.lv-btn[data-level="advanced"]'), '레벨 전환 버튼 2개 존재');
  ok(q('.lv-btn[data-level="beginner"]').textContent.indexOf('헬린이') !== -1, '헬린이 버튼 라벨');
  ok(q('.lv-btn[data-level="advanced"]').textContent.indexOf('헬창') !== -1, '헬창 버튼 라벨');
  P.setLevel('beginner', true);
  ok(P.getLevel() === 'beginner', '기본 레벨 = 헬린이 (실제 ' + P.getLevel() + ')');
  ok(q('.lv-btn[data-level="beginner"]').getAttribute('aria-pressed') === 'true', '헬린이 버튼 선택 표시');
  ok(app.localStorage.getItem(P.levelKey) === 'beginner', '레벨이 localStorage에 저장');
  ok(app.document.body.getAttribute('data-level') === 'beginner', 'body[data-level] 반영');
  const descB = txt('#lvDesc');
  q('.lv-btn[data-level="advanced"]').click();
  ok(P.getLevel() === 'advanced', '헬창으로 전환 (실제 ' + P.getLevel() + ')');
  ok(q('.lv-btn[data-level="advanced"]').getAttribute('aria-pressed') === 'true' &&
     q('.lv-btn[data-level="beginner"]').getAttribute('aria-pressed') === 'false', '버튼 상태가 헬창으로 전환');
  ok(app.localStorage.getItem(P.levelKey) === 'advanced', '전환된 레벨 저장');
  ok(txt('#lvDesc') !== descB && txt('#lvDesc').indexOf('상급') >= 0, '설명 문구도 바뀜 (' + txt('#lvDesc') + ')');
  ok(app.document.body.getAttribute('data-level') === 'advanced', 'body 속성도 헬창');
  ok(q('#toast').textContent.indexOf('헬창') !== -1, '전환 토스트 표시 (' + q('#toast').textContent + ')');

  /* 같은 점수라도 레벨에 따라 코멘트 톤이 다르다 */
  const cmtB = P.commentFor(75, 'squat', { reps: 5, level: 'beginner' }, 'beginner');
  const cmtA = P.commentFor(75, 'squat', { reps: 5, level: 'advanced' }, 'advanced');
  ok(cmtB !== cmtA, '리포트 한 줄 코멘트가 레벨별로 다름');
  ok(cmtB.indexOf('좋아요') >= 0 || cmtB.indexOf('볼까요') >= 0, '헬린이 코멘트는 격려형: ' + cmtB);
  ok(cmtA.indexOf('감점') >= 0 || cmtA.indexOf('교정') >= 0, '헬창 코멘트는 수치·교정형: ' + cmtA);

  /* 기록·카드에 레벨 배지 */
  P.clearRecords();
  const recB = P.buildRecord({ level: 'beginner', reps: 10, avgScore: 82, durationMs: 40000, frames: 400,
    issues: [{ code: 'squat_depth_mid', label: '깊이 살짝 부족', count: 1 }] }, 'squat', Date.now());
  const recA = P.buildRecord({ level: 'advanced', reps: 10, avgScore: 82, durationMs: 40000, frames: 400,
    issues: [{ code: 'squat_depth_mid', label: '깊이 살짝 부족', count: 1 }] }, 'squat', Date.now() - 1000);
  ok(recA.level === 'advanced' && recA.levelName === '헬창', '헬창 기록에 레벨 필드 저장');
  P.saveRecords([recA, recB]);
  P.renderRecords();
  const lvEls = q('#recList').querySelectorAll('.lv');
  ok(lvEls.length === 2, '최근 기록 2건에 레벨 배지 (실제 ' + lvEls.length + ')');
  ok((q('#recList').textContent || '').indexOf('헬창') !== -1 && (q('#recList').textContent || '').indexOf('헬린이') !== -1,
     '기록 리스트에 헬린이·헬창 배지 표시');
  const lvAdvEl = Array.prototype.slice.call(lvEls).filter(function(el){ return el.getAttribute('data-level') === 'advanced'; })[0];
  const lvBegEl = Array.prototype.slice.call(lvEls).filter(function(el){ return el.getAttribute('data-level') === 'beginner'; })[0];
  ok(!!lvAdvEl && lvAdvEl.textContent.indexOf('🔥') !== -1 && lvAdvEl.className.indexOf('adv') !== -1, '헬창 배지 스타일·이모지');
  ok(!!lvBegEl && lvBegEl.textContent.indexOf('🐣') !== -1, '헬린이 배지 이모지');
  const cardA = P.cardCanvas(recA);
  ok(cardA.width === 1080 && cardA.height === 1350, '레벨 기록도 결과 카드 1080×1350');
  const urlA = P.cardDataUrl(recA);
  ok(urlA.indexOf('data:image/png;base64,') === 0 && urlA.length > 20000, '레벨 배지 포함 PNG 생성 (' + Math.round(urlA.length / 1024) + 'KB)');
  P.clearRecords();
  q('.lv-btn[data-level="beginner"]').click();
  ok(P.getLevel() === 'beginner', '헬린이로 복귀');
  say('');

  /* ---------- 7) 실시간 카메라 일시정지 / 재개 ---------- */
  say('▸ 7. 실시간 카메라 일시정지 / 재개');
  ok(!!q('#camPause'), '일시정지 버튼 존재');
  q('.modes button[data-mode="camera"]').click();
  ok(txt('#camPause') === '⏸ 일시정지', '기본 라벨 = 일시정지');
  ok(q('#camPause').disabled === true, '카메라 시작 전에는 비활성');
  ok(q('#hudPause').hidden === true, '일시정지 배지는 처음에 숨김');
  /* 실제 카메라 없이 상태 기계만 검증 */
  P.state.stream = { getTracks: function(){ return []; } };
  q('#camPause').disabled = false;
  ok(P.setCameraPaused(true) === true, '일시정지 진입');
  ok(P.isCameraPaused() === true, 'state.paused = true');
  ok(txt('#camPause') === '▶ 재개', '버튼이 재개로 바뀜');
  ok(q('#hudPause').hidden === false, '“일시정지 중” 배지 표시');
  ok(q('#stage').classList.contains('paused'), '프리뷰가 어두워지는 일시정지 상태');
  ok(txt('#hudPhase') === '일시정지', 'HUD 상태 문구 일시정지');
  ok(P.setCameraPaused(false) === true, '재개');
  ok(P.isCameraPaused() === false, 'state.paused = false');
  ok(txt('#camPause') === '⏸ 일시정지', '버튼 라벨 원복');
  ok(q('#hudPause').hidden === true && !q('#stage').classList.contains('paused'), '일시정지 배지·어둡게 처리 해제');
  /* 정리: 영상 모드로 돌아가면 카메라·루프가 정리된다 */
  q('.modes button[data-mode="video"]').click();
  await wait(150);
  ok(P.state.stream === null && q('#camPause').disabled === true, '영상 모드 복귀 시 일시정지 버튼 비활성');
  say('');

  /* ---------- 8) 콘솔 에러 ---------- */
  say('▸ 8. 에러 확인');
  const real = errors.filter(function(e){ return e && e.indexOf('ResizeObserver') === -1; });
  ok(real.length === 0, '앱에서 발생한 JS 에러 0건' + (real.length ? ' → ' + real.join(' | ') : ''));
  const collected = (app.__prehealthErrors || []).filter(function(e){ return String(e).indexOf('ResizeObserver') === -1; });
  ok(collected.length === 0, '앱 자체 오류 수집기도 0건' + (collected.length ? ' → ' + collected.join(' | ') : ''));

  /* 테스트가 남긴 기록 정리 */
  P.clearRecords();
  P.closePro();
  P.closeCardModal();
  done();
})();
</script>
</body>
</html>
