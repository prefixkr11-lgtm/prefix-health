<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prehealth · v17 기능 테스트 (플랫 스타일·기록·카드·Pro·레벨·일시정지·인트로·☰ 메뉴·휴식 타이머·고속 스캔·오늘의 루틴)</title>
<style>
  body{background:#0F0F11;color:#F2F2F0;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px;margin:0}
  h1{font-size:15px;letter-spacing:.02em}
  pre{white-space:pre-wrap;word-break:break-word}
  .ok{color:#4FBE86}.ng{color:#D8576E}
  iframe{width:390px;height:780px;border:1px solid #333;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<h1>Prehealth v17 · 기능 테스트 (플랫·매트 스타일 / 기록 / 결과 카드 / Pro / 헬린이·헬창 / 카메라 일시정지 / 인트로 / ☰ 메뉴·휴식 타이머 / 고속 스캔 / 오늘의 루틴)</h1>
<pre id="out">index.html을 불러오는 중…</pre>
<iframe id="app" src="../index.html" title="Prehealth 앱"></iframe>
<script>
const lines = [];
const outEl = document.getElementById('out');
let fails = 0;
function say(s){ lines.push(s); render(); }
function ok(cond, msg){
  if (!cond) fails++;
  lines.push((cond ? 'PASS  ' : 'FAIL  ') + msg);
  render();
}
function render(){
  outEl.innerHTML = lines.map(function(l){
    return l.indexOf('FAIL') === 0 ? '<span class="ng">' + l + '</span>' : l;
  }).join('\n');
}
function done(){
  lines.push(fails ? 'RESULT: FAIL (' + fails + '건)' : 'RESULT: ALL PASS');
  render();
  document.title = fails ? 'FAIL' : 'ALL PASS';
}

/* 앱 안에서 나는 에러를 모은다 */
const errors = [];
const frame = document.getElementById('app');
function watchErrors(win){
  win.addEventListener('error', function(e){
    errors.push('error: ' + (e.message || e.error) + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  win.addEventListener('unhandledrejection', function(e){
    errors.push('reject: ' + (e.reason && (e.reason.message || e.reason)));
  });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
/* 앱 부팅 직후를 놓치지 않도록, 테스트 스크립트가 시작되는 순간부터 iframe 안의
   스플래시 DOM이 '처음 보인 시각'과 '사라진 시각'을 부모 시계로 잰다 (인트로 길이 검증용) */
const bootWatch = (function(){
  const t0 = performance.now();
  let seen = null, gone = null;
  return new Promise(function(resolve){
    const iv = setInterval(function(){
      let el = null, d = null;
      try { d = frame.contentDocument; } catch (e) {}
      try { el = d ? d.getElementById('splash') : null; } catch (e) {}
      if (seen === null && el) seen = performance.now();
      if (seen !== null && !el){
        clearInterval(iv);
        gone = performance.now();
        resolve({ seen: seen, gone: gone, waited: t0 });
      }
    }, 15);
    setTimeout(function(){ clearInterval(iv); resolve({ seen: seen, gone: gone, waited: t0 }); }, 12000);
  });
})();
async function until(fn, timeoutMs, step){
  const t0 = Date.now();
  while (Date.now() - t0 < (timeoutMs || 20000)){
    try { const v = fn(); if (v) return v; } catch (e) {}
    await wait(step || 120);
  }
  return null;
}
function dayISO(offset){
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return d.toISOString();
}
function seed(offset, score, kind){
  return {
    id: 'seed' + offset + '-' + Math.random().toString(36).slice(2, 6),
    date: dayISO(offset), exercise: kind || 'squat', exerciseName: '스쿼트',
    metricLabel: '반복', metricValue: '12', score: score, durationSec: 41,
    topFeedback: '조금 더 깊이 ×2', comment: '전반적으로 좋아요. 고칠 점 한두 개만 잡으면 훨씬 깔끔해져요.'
  };
}
function decodeImage(src){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('image decode failed')); };
    img.src = src;
  });
}

(async function run(){
  const app = await new Promise(function(resolve, reject){
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentWindow.Prehealth){
      return resolve(frame.contentWindow);
    }
    frame.addEventListener('load', function(){ resolve(frame.contentWindow); }, { once: true });
    setTimeout(function(){ reject(new Error('iframe load timeout')); }, 30000);
  }).catch(function(e){ say('FAIL  앱 로드: ' + e.message); return null; });
  if (!app) return done();
  watchErrors(app);
  const doc = app.document;

  const P = await until(function(){ return app.Prehealth; }, 30000);
  if (!P){ say('FAIL  window.Prehealth 공개 API를 찾지 못함'); return done(); }
  say('앱 로드 완료 · 버전 ' + P.version);
  ok(P.version === 'v17', '공개 API 버전 v17 (실제 ' + P.version + ')');
  say('');

  const q = function(sel){ return doc.querySelector(sel); };
  const txt = function(sel){ const el = q(sel); return el ? el.textContent.trim() : null; };

  /* ---------- 1) 기본 구조 ---------- */
  say('▸ 1. 화면 구조');
  ok(!!q('#menuBtn') && !q('#proBadge'), '헤더 우상단 ☰ 메뉴 버튼 · PRO 배지는 헤더에서 걷어냄');
  ok(!!q('#menuDrawer') && q('#menuDrawer').hidden === true, '메뉴 드로어 존재 · 처음엔 닫힘');
  ok(!!q('#proLock'), '리포트 안 Pro 잠금 카드 존재');
  ok(!!q('#repCard'), '리포트에 “결과 카드 저장” 버튼 존재');
  ok(!!q('#records') && !!q('#weekBars') && !!q('#recList'), '내 기록 섹션 구성');
  ok(q('#cardModal').hidden === true && q('#proModal').hidden === true, '모달은 처음에 닫혀 있음');
  /* v15: 우측 ‘실시간 코칭’ 카드를 걷어냈다 — DOM·스타일 모두 남지 않음 */
  ok(!q('#logList') && !q('.logList') && !q('.logEmpty') && !q('.logItem'),
     '실시간 코칭 박스 DOM 제거 (logList·logItem·logEmpty 없음)');
  ok((doc.body.textContent || '').indexOf('실시간 코칭') === -1 &&
     (doc.body.textContent || '').indexOf('피드백이 여기에 쌓여요') === -1,
     '화면 어디에도 실시간 코칭 문구 없음');
  const rulesNow = Array.prototype.slice.call(doc.styleSheets[0].cssRules).map(function(r){ return r.cssText; }).join('\n');
  ok(rulesNow.indexOf('logList') === -1 && rulesNow.indexOf('logItem') === -1 && rulesNow.indexOf('logEmpty') === -1,
     '실시간 코칭용 스타일 규칙도 제거');
  /* v15: 영상 자동 분석(고속 스캔) 진행률 UI */
  ok(!!q('#scanBox') && q('#scanBox').hidden === true, '영상 분석 진행률 박스 존재 · 처음엔 숨김');
  ok(!!q('#scanBar') && !!q('#scanCancel'), '진행 바와 “그만 볼래요” 버튼 존재');
  ok((q('#scanTitle').textContent || '').indexOf('영상 분석 중') === 0, '진행 문구: ' + q('#scanTitle').textContent);
  ok(typeof P.startScan === 'function' && P.startScan() === false, '영상이 없을 때 분석 시작 요청은 안전하게 무시');
  ok(P.isScanning() === false, '처음엔 분석 중 아님');
  /* v16: 분석 속도 — 6~8fps · 최대 140장 · 폭 480px 리사이즈 */
  ok(P.scan.targetFps >= 6 && P.scan.targetFps <= 8, '기본 샘플링 6~8fps (' + P.scan.targetFps + 'fps)');
  ok(P.scan.maxFrames >= 120 && P.scan.maxFrames <= 140, '최대 프레임 120~140 (' + P.scan.maxFrames + '장)');
  ok(P.scanPlan(10).total === 80, '10초 영상은 8fps로 80장 (' + P.scanPlan(10).total + '장)');
  ok(P.scanPlan(30).total === 140, '30초 영상은 최대 140장으로 제한 (' + P.scanPlan(30).total + '장)');
  ok(P.scanPlan(600).total === 140, '긴 영상도 140장까지만 (' + P.scanPlan(600).total + '장)');
  ok(P.scanPlan(600).step > P.scanPlan(10).step, '긴 영상은 간격을 늘려 같은 장수로 훑음');
  ok(P.scan.tailFrames === 25, '시간 예산 초과 시 25장으로 빠르게 마무리 (' + P.scan.tailFrames + '장)');
  ok(P.scan.budgetMs <= 7000, '시간 예산 6초 이내 (' + P.scan.budgetMs + 'ms)');
  const szFhd = P.scanFrameSize(1080, 1920);
  ok(szFhd.w === 480 && Math.abs(szFhd.h - 853) <= 1, '1080×1920 → 폭 480px 비율 유지 (' + szFhd.w + '×' + szFhd.h + ')');
  const sz4k = P.scanFrameSize(3840, 2160);
  ok(sz4k.w === 480 && sz4k.h === 270, '4K 가로 영상도 폭 480px (' + sz4k.w + '×' + sz4k.h + ')');
  const szSmall = P.scanFrameSize(360, 640);
  ok(szSmall.w === 360 && szSmall.h === 640, '작은 영상은 늘리지 않음 (' + szSmall.w + '×' + szSmall.h + ')');
  ok(P.scan.maxWidth === 480, '리사이즈 기준 폭 480px (' + P.scan.maxWidth + ')');
  ok(!!q('#repNew') && q('#repNew').hidden === true, '리포트에 “다른 영상 올리기” 버튼(영상 모드에서만)');
  /* v15: 운동 8종 컴팩트 목록 */
  const exBtns = doc.querySelectorAll('.ex-btn');
  ok(exBtns.length === 8, '운동 8종 버튼 (실제 ' + exBtns.length + ')');
  const exNames = Array.prototype.slice.call(doc.querySelectorAll('.ex-btn .nm')).map(function(el){ return el.textContent.trim(); });
  say('   종목: ' + exNames.join(' · '));
  ok(exNames.indexOf('런지') >= 0 && exNames.indexOf('턱걸이') >= 0 &&
     exNames.indexOf('데드리프트') >= 0 && exNames.indexOf('윗몸일으키기') >= 0,
     '런지·턱걸이·데드리프트·윗몸일으키기 추가');
  ok(doc.querySelectorAll('.ex-btn .fc').length === 8 && doc.querySelectorAll('.ex-btn .no').length === 8,
     '각 줄에 번호 + 짧은 한 줄 포인트');
  ok(doc.querySelectorAll('.ex-btn .en').length === 0, '영어 부제목(EN) 제거');
  const fcBad = Array.prototype.slice.call(doc.querySelectorAll('.ex-btn .fc')).filter(function(el){ return el.textContent.trim().length > 7; });
  ok(fcBad.length === 0, '한 줄 포인트는 7자 이내' + (fcBad.length ? ' (긴 것: ' + fcBad[0].textContent + ')' : ''));
  say('▸ 1-3. 새 종목 선택 동작');
  q('.ex-btn[data-ex="situp"]').click();
  ok(txt('#hudEx') === '윗몸일으키기', '윗몸일으키기를 고르면 HUD 이름도 바뀜 (' + txt('#hudEx') + ')');
  ok(q('.ex-btn[data-ex="situp"]').getAttribute('aria-selected') === 'true', '고른 종목이 선택 표시');
  ok(txt('#ml0') === '반복' && txt('#mu2') === '점', '지표 카드도 반복·점수로 바뀜');
  q('.ex-btn[data-ex="deadlift"]').click();
  ok(txt('#ml1') === '상체 숙임', '데드리프트 지표 = 상체 숙임 (' + txt('#ml1') + ')');
  q('.ex-btn[data-ex="squat"]').click();
  ok(txt('#hudEx') === '스쿼트', '스쿼트로 복귀');
  ok(typeof P.commentFor(80, 'pullup', { reps: 3 }, 'beginner') === 'string' &&
     P.commentFor(80, 'pullup', { reps: 3 }, 'beginner') !== P.commentFor(80, 'pullup', { reps: 3 }, 'advanced'),
     '새 종목도 레벨별 한 줄 코멘트가 나옴');
  ok(q('#proModal').textContent.indexOf('4,900') !== -1 && q('#proModal').textContent.indexOf('39,000') !== -1,
     'Pro 요금제 월 4,900 / 연 39,000 노출');
  ok(q('.top').classList.contains('rise') && doc.querySelectorAll('.rise').length >= 8,
     '메인 요소 순차 등장(stagger) 적용 (' + doc.querySelectorAll('.rise').length + '개)');
  /* v13 인트로: P(왼쪽 위)·H(오른쪽 아래)가 화면 밖에서 크게 날아와 'PH'로 합쳐지고 커튼처럼 위로 걷힌다 (~1.9초·글자만) */
  const sheet = doc.styleSheets[0];
  const rules = Array.prototype.slice.call(sheet.cssRules);
  const sel = function(selector){
    return rules.filter(function(r){ return r.selectorText === selector; })[0] || null;
  };
  const kf = {};
  rules.forEach(function(r){ if (r.name) kf[r.name] = r.cssText; });
  const durOf = function(el){ return el ? parseFloat(el.style.animationDuration) : NaN; };
  const delayOf = function(el){ return el ? parseFloat(el.style.animationDelay) : NaN; };
  const cssOf = function(el){ return el ? el.style.cssText : ''; };
  const sp = sel('.splash');
  const spPH = sel('.splashPH'), spP = sel('.splashP'), spH = sel('.splashH');
  const spWord = sel('.splashWord');
  ok(!!sp && sp.style.pointerEvents === 'none', '스플래시 레이어는 입력을 막지 않음 (pointer-events: none)');
  ok(txt('.splashP') === 'P' && txt('.splashH') === 'H', '합체 로고에 P·H 두 글자 존재');
  /* 네온/글로우 제거 확인: 섬광·퍼지는 링·글로우 레이어가 CSS에도 DOM에도 없다 */
  ok(!sel('.splashFlash') && !sel('.splashRing') && !sel('.splashGlow') && !kf.splashFlash && !kf.splashRing && !kf.splashGlow,
     '섬광(flash)·링(ring)·글로우 레이어와 키프레임 없음');
  ok(!q('.splashFlash') && !q('.splashRing') && !q('.splashGlow'),
     '스플래시 DOM에도 섬광·링·글로우 요소 없음');
  ok(!!spP && cssOf(spP).indexOf('text-shadow') === -1 && !!spH && cssOf(spH).indexOf('text-shadow') === -1,
     '글자에 네온 text-shadow 없음');
  /* v13: 배지 판(둥근 사각·원형 배경)을 걷어내고 순수 글자만 남겼는지 */
  ok(!sel('.splashPlate') && !sel('.splashBadge') && !kf.splashPlateIn && !kf.splashPlate,
     '배지 판(.splashPlate / .splashBadge) 규칙과 키프레임이 CSS에서 제거됨');
  ok(!q('.splashPlate') && !q('.splashBadge') && !!q('.splashPH') &&
     q('.splashPH').children.length === 2 && !q('.splashPH').children[0].children.length,
     '스플래시 DOM은 배지 박스 없이 P·H 글자만 (무대 자식 2개)');
  const propOf = function(rule, name, fallback){
    if (!rule) return '없음';
    const v = rule.style.getPropertyValue(name);
    return v ? v : (fallback || '');
  };
  const phBg = propOf(spPH, 'background-color');
  const phBgImg = propOf(spPH, 'background-image');
  ok(!!spPH && (phBgImg === '' || phBgImg === 'none') &&
     (phBg === '' || phBg === 'initial' || phBg === 'transparent' || phBg === 'rgba(0, 0, 0, 0)') &&
     propOf(spPH, 'border-top-width', '0px') === '0px' &&
     propOf(spPH, 'border-radius', '0px') === '0px' &&
     propOf(spPH, 'padding-top', '0px') === '0px' &&
     propOf(spPH, 'box-shadow', 'none') === 'none',
     '합체 무대에 배경색·배경판·테두리·둥근 모서리·패딩·그림자 없음 — 순수 글자 (' +
     (spPH ? cssOf(spPH) : '없음') + ')');
  ok(!!spP && /#FFFFFF|rgb\(255,\s*255,\s*255\)/i.test(cssOf(spP)),
     'P는 화이트 글자 (' + (spP ? spP.style.color : '없음') + ')');
  ok(!!spH && /#6DB79B|#34D399|#10B981|rgb\((109,\s*183,\s*155|52,\s*211,\s*153|16,\s*185,\s*129)\)/i.test(cssOf(spH)),
     'H는 차분한 에메랄드 글자 (' + (spH ? spH.style.color : '없음') + ')');
  const spFont = spPH ? parseFloat(spPH.style.fontSize) : NaN;
  ok(spFont >= 64 && spFont <= 76, 'P·H 글자는 크게 64~76px (' + spFont + 'px)');
  ok(!!spPH && parseInt(spPH.style.fontWeight, 10) >= 800, 'P·H 글자는 굵고 단단한 타이포 (font-weight ' +
     (spPH ? spPH.style.fontWeight : '없음') + ')');
  ok(!!sp && /#0F0F11|rgb\(15,\s*15,\s*17\)/i.test(cssOf(sp)), '스플래시 배경은 플랫 다크(#0F0F11)');

  /* ---------- 1-2) v14: 앱 내부 전체가 플랫·매트 미니멀 (네온·글로우·그라데이션 0) ---------- */
  say('▸ 1-2. 플랫·매트 스타일 (네온·글로우·그라데이션 제거)');
  const cssAll = rules.map(function(r){ return r.cssText; }).join('\n');
  ok(cssAll.indexOf('box-shadow') === -1, '앱 스타일에 box-shadow 0건 — 빛번짐·그림자 글로우 없음');
  ok(cssAll.indexOf('text-shadow') === -1, '앱 스타일에 text-shadow 0건 — 네온 글자 없음');
  ok(cssAll.toLowerCase().indexOf('gradient') === -1, '앱 스타일에 그라데이션 0건 (배경·버튼·배지·막대 전부 단색)');
  /* 형광빛 밝은 에메랄드(#34D399 / #10B981)가 스타일 어디에도 남아 있지 않다 — 단, 카드 캔버스는 별도 검사 */
  ok(cssAll.indexOf('#34D399') === -1 && cssAll.indexOf('#10B981') === -1 &&
     cssAll.indexOf('52, 211, 153') === -1 && cssAll.indexOf('16, 185, 129') === -1,
     '형광 에메랄드(#34D399 / #10B981)가 스타일에서 사라짐');
  const rootCS = app.getComputedStyle(doc.documentElement);
  const tok = function(name){ return (rootCS.getPropertyValue(name) || '').trim(); };
  ok(tok('--bg') === '#0F0F11', '바탕 #0F0F11 (' + tok('--bg') + ')');
  ok(tok('--card') === '#161618', '카드 #161618 단색 (' + tok('--card') + ')');
  ok(tok('--line') === '#262629', '얇은 보더 #262629 (' + tok('--line') + ')');
  ok(tok('--emerald-2') === '#6DB79B', '차분한 에메랄드 포인트 #6DB79B (' + tok('--emerald-2') + ')');
  ok(tok('--emerald') === '#10664A', '딥 에메랄드 #10664A (' + tok('--emerald') + ')');
  const csOf = function(sel2){ const el = q(sel2); return el ? app.getComputedStyle(el) : null; };
  const blank = function(v){ return v === '' || v === 'none'; };
  const markCS = csOf('.brand .mark');
  ok(!!markCS && markCS.backgroundColor === 'rgb(16, 102, 74)' && blank(markCS.boxShadow) &&
     blank(markCS.backgroundImage),
     '헤더 [P] 배지는 플랫 단색 #10664A · 그림자 없음 (' + (markCS ? markCS.backgroundColor + ' / ' + markCS.boxShadow : '없음') + ')');
  const menuCS = csOf('#menuBtn');
  ok(!!menuCS && menuCS.borderTopWidth === '1px' && menuCS.borderTopStyle === 'solid' &&
     blank(menuCS.boxShadow) && blank(menuCS.backgroundImage) && menuCS.backgroundColor === 'rgb(22, 22, 24)',

  ok(!!kf.splashFlyP && /translate\(-36vw,\s*-30vh\)/.test(kf.splashFlyP) && /scale\(1\.8\)/.test(kf.splashFlyP) &&

  ok(!!kf.splashFlyP && /translate\(0(px)?,\s*0(px)?\)/.test(kf.splashFlyP) && /scale\(1\)/.test(kf.splashFlyP) &&
     !!kf.splashFlyH && /translate\(0(px)?,\s*0(px)?\)/.test(kf.splashFlyH) && /scale\(1\)/.test(kf.splashFlyH),
     '두 글자 모두 중앙 제자리(translate 0,0 · scale 1)로 정확히 착지');
  ok(!!spP && spP.style.animationName === 'splashFlyP' && durOf(spP) === 0.85 && delayOf(spP) === 0 &&
     spP.style.animationTimingFunction.indexOf('cubic-bezier(0.22, 1, 0.36, 1)') !== -1,
     'P 비행 구간 0초~0.85초 · ease-out cubic-bezier(0.22, 1, 0.36, 1) (' +

  ok(!!spH && spH.style.animationName === 'splashFlyH' && durOf(spH) === 0.85 && delayOf(spH) === 0 &&
     spH.style.animationTimingFunction.indexOf('cubic-bezier(0.22, 1, 0.36, 1)') !== -1,
     'H 비행 구간 0초~0.85초 · ease-out cubic-bezier(0.22, 1, 0.36, 1) (' +

  /* 합체 탄성: 0.82초 시작, scale 1.12 → 1 */
  ok(!!kf.splashMerge && /scale\(1\.12\)/.test(kf.splashMerge) && /scale\(1\)/.test(kf.splashMerge) &&
     !!spPH && spPH.style.animationName === 'splashMerge' && delayOf(spPH) === 0.82 && durOf(spPH) === 0.36,
     '합체 순간 0.82초~1.18초 탄성 키프레임 (scale .86 → 1.12 → 1) (' +
     (spPH ? spPH.style.animationDelay + ' + ' + spPH.style.animationDuration : '없음') + ')');
  const atMerge = rules.filter(function(r){ return r.selectorText && r.style && r.style.animationDelay === '0.82s'; })
    .map(function(r){ return r.selectorText; });
  ok(atMerge.length === 1 && atMerge[0] === '.splashPH',
     '합체(0.82초)에 움직이는 것은 글자 무대(.splashPH) 하나뿐 — 배지 판 없음 (' + atMerge.join(', ') + ')');
  ok(!!spWord && spWord.style.animationName === 'splashWordIn' && delayOf(spWord) === 0.95 && spWord.style.opacity === '0',
     'Prehealth 워드마크는 합체 뒤 0.95초에 등장');
  /* 완성 로고 유지 구간: 워드마크 등장 끝(1.19초) ~ 커튼 시작(1.45초) */
  const wordEnd = (spWord ? delayOf(spWord) + durOf(spWord) : NaN);
  const curtainStart = (sp ? delayOf(sp) : NaN);
  ok(!!sp && wordEnd <= curtainStart && curtainStart - wordEnd >= 0.2,

  ok(!!kf.splashCurtain && /translateY\(0px\)|translateY\(0\)/.test(kf.splashCurtain) && /translateY\(-100%\)/.test(kf.splashCurtain),

  ok(!!sp && Math.abs((delayOf(sp) + durOf(sp)) - 1.9) < 0.001,

  const mq = rules.filter(function(r){ return r.conditionText && r.conditionText.indexOf('prefers-reduced-motion') !== -1; })[0];
  const inMq = function(selector){
    if (!mq) return null;
    const found = Array.prototype.slice.call(mq.cssRules).filter(function(r){
      if (!r.selectorText) return false;
      return r.selectorText.split(',').map(function(s){ return s.trim(); }).indexOf(selector) !== -1;
    });
    return found[0] || null;
  };
  const mqSplash = inMq('.splash'), mqInner = inMq('.splashInner');
  const mqP = inMq('.splashP'), mqH = inMq('.splashH'), mqPH = inMq('.splashPH'), mqWord = inMq('.splashWord');

  /* DOM 제거 시점: 스플래시가 처음 그려진 때부터 약 1.96초 (2.6초 강제 정리보다 훨씬 앞) */

  rec.comment = '전반적으로 좋아요. 고칠 점 한두 개만 잡으면 훨씬 깔끔해져요.';

  ok(q('#routineRest').hidden === false, '휴식 카운트다운 판이 무대 위에 뜸');
  ok(txt('#routineBarText') === '루틴 1/3 · 스쿼트 끝 · 휴식', '진행 바도 휴식 표시 (' + txt('#routineBarText') + ')');
  ok(q('#routineSetDone').hidden === true, '휴식 중에는 세트 끝 버튼을 숨김');
  ok(txt('#routineRestNext') === '다음 · 푸시업 10회', '다음 운동 예고 (' + txt('#routineRestNext') + ')');
  const rest0 = P.routine.state();
  ok(rest0.restSec === 45 && rest0.restLeftMs >= 43000 && rest0.restLeftMs <= 45000, '휴식 45초에서 시작 (' + Math.round(rest0.restLeftMs) + 'ms)');
  ok(txt('#routineRestClock') === '0:45' || txt('#routineRestClock') === '0:44', '휴식 시계 표시 (' + txt('#routineRestClock') + ')');
  await wait(1250);
  const rest1 = P.routine.state();
  ok(rest1.phase === 'rest' && rest1.restLeftMs <= 44000 && rest1.restLeftMs >= 41500, '시계가 줄어듦 (' + Math.round(rest1.restLeftMs) + 'ms)');

  /* 건너뛰기 → 다음 운동 */
  q('#routineSkip').click();
  ok(q('#routineRest').hidden === true, '건너뛰면 휴식 판이 닫힘');
  ok(P.routine.state().index === 1 && P.routine.state().phase === 'exercise', '다음 운동(2/3)으로 전환');
  ok(txt('#hudEx') === '푸시업' && q('.ex-btn[data-ex="pushup"]').getAttribute('aria-selected') === 'true', 'HUD·운동 카드가 푸시업으로');
  ok(txt('#routineBarText') === '루틴 2/3 · 푸시업 · 목표 10회', '진행 바 2/3 (' + txt('#routineBarText') + ')');
  ok(parseFloat(q('#routineBarFill').style.width) > 30, '진행 바가 1/3만큼 참 (' + q('#routineBarFill').style.width + ')');

  /* 휴식 0초 → 자동 전환 */
  q('#routineSetDone').click();
  ok(P.routine.state().phase === 'rest' && P.routine.state().index === 1, '두 번째 세트 끝 → 휴식');
  P.routine.finishRest(true);
  ok(P.routine.state().index === 2 && P.routine.state().phase === 'exercise', '휴식이 0초가 되면 다음 운동으로 자동 전환');
  ok(txt('#hudEx') === '플랭크' && txt('#routineBarText') === '루틴 3/3 · 플랭크 · 목표 30초',
     '마지막 운동 = 플랭크 30초 (' + txt('#routineBarText') + ')');

  /* 마지막 운동 → 완료 요약 */
  q('#routineSetDone').click();
  await wait(150);
  ok(q('#routineDone').hidden === false, '마지막 운동이 끝나면 완료 요약이 뜸');
  ok(txt('#routineDoneCount') === '3', '완료한 운동 수 3 (' + txt('#routineDoneCount') + ')');
  ok(txt('#routineDoneScore') === '–', '점수가 없으면 평균은 – (' + txt('#routineDoneScore') + ')');
  ok((txt('#routineDoneLead') || '').indexOf('3개 운동') !== -1, '요약 문구 (' + txt('#routineDoneLead') + ')');
  ok(q('#routineDoneList').querySelectorAll('li').length === 3, '운동별 결과 3줄');
  ok(q('#routineBar').hidden === true && P.routine.state().active === false, '완료하면 진행 바가 닫히고 루틴 종료');
  ok(doc.body.style.overflow === 'hidden', '요약 모달은 뒤 화면 스크롤을 잠금');

  /* 한 번 더 */
  q('#routineAgain').click();
  ok(q('#routineDone').hidden === true && doc.body.style.overflow === '', '한 번 더 → 모달 닫기');
  ok(P.routine.state().active === true && P.routine.state().index === 0 && P.routine.state().name === '전신 기본',
     '같은 루틴을 처음부터 다시 시작');
  ok(txt('#routineBarText') === '루틴 1/3 · 스쿼트 · 목표 10회', '다시 1/3 스쿼트 (' + txt('#routineBarText') + ')');

  /* 다른 운동을 직접 고르면 루틴은 접힌다 */
  q('.ex-btn[data-ex="lunge"]').click();
  ok(P.routine.state().active === false && q('#routineBar').hidden === true, '루틴 중 다른 운동을 고르면 루틴 종료');
  ok(txt('#hudEx') === '런지', '고른 운동으로 전환');

  /* 나만의 루틴 만들기 */
  P.routine.clearCustom();
  P.openMenu('routine');
  ok((q('#routineCustomBox').textContent || '').indexOf('아직 없어요') !== -1, '나만의 루틴 없음 안내');
  q('#routineBuild').click();
  ok(q('#routineEditor').hidden === false, '만들기 → 편집기 열림');
  ok(q('#routineExChips').querySelectorAll('.rExChip').length === 8, '운동 8종에서 선택');
  ok(q('#routineRestChips').querySelectorAll('.chip').length === 3 &&
     q('#routineRestChips .chip[data-rest="45"]').getAttribute('aria-pressed') === 'true', '휴식 30/45/60초 · 기본 45초');
  ok(txt('#routineGoalUnit') === '회', '스쿼트 목표 단위 = 회');
  q('#routineExChips .rExChip[data-ex="plank"]').click();
  ok(txt('#routineGoalUnit') === '초', '플랭크 목표 단위 = 초');
  q('#routineGoal').value = '25';
  q('#routineRestChips .chip[data-rest="30"]').click();
  q('#routineAdd').click();
  q('#routineExChips .rExChip[data-ex="pullup"]').click();
  q('#routineGoal').value = '8';
  q('#routineAdd').click();
  ok(q('#routineDraft').querySelectorAll('li').length === 2, '초안 2개');
  ok((q('#routineDraft').textContent || '').indexOf('플랭크 25초') !== -1, '초안에 플랭크 25초');
  ok((q('#routineDraft').textContent || '').indexOf('휴식 30초') !== -1, '운동 사이 휴식 30초 표시');
  q('#routineDraft li .dX').click();
  ok(q('#routineDraft').querySelectorAll('li').length === 1, '✕로 한 줄 빼기');
  q('#routineExChips .rExChip[data-ex="plank"]').click();
  q('#routineGoal').value = '25';
  q('#routineRestChips .chip[data-rest="30"]').click();
  q('#routineAdd').click();
  ok(q('#routineDraft').querySelectorAll('li').length === 2, '뺀 운동을 다시 넣으면 2개');
  q('#routineName').value = '테스트 루틴';
  q('#routineSave').click();
  await wait(80);
  const savedCustom = P.routine.readCustom();
  ok(!!savedCustom && savedCustom.name === '테스트 루틴' && savedCustom.steps.length === 2,
     '나만의 루틴 저장 (name ' + (savedCustom && savedCustom.name) + ')');
  ok(savedCustom.steps[0].ex === 'pullup' && savedCustom.steps[0].goal === 8, '첫 운동 = 턱걸이 8회');
  ok(savedCustom.steps[1].ex === 'plank' && savedCustom.steps[1].goal === 25 && savedCustom.steps[1].rest === 30,
     '둘째 운동 = 플랭크 25초 · 휴식 30초');
  ok(app.localStorage.getItem(P.routine.key) !== null, 'localStorage 키 ' + P.routine.key + '에 저장');
  ok(q('#routineEditor').hidden === true, '저장하면 편집기가 닫힘');
  ok((q('#routineCustomBox').textContent || '').indexOf('테스트 루틴') !== -1, '나만의 루틴 카드 표시');

  /* 저장한 루틴 시작 */
  q('#routineCustomBox .rCardMain[data-custom]').click();
  ok(txt('#routineBarText') === '루틴 1/2 · 턱걸이 · 목표 8회', '저장한 루틴 시작 (' + txt('#routineBarText') + ')');
  ok(txt('#hudEx') === '턱걸이', '턱걸이로 시작');
  q('#routineQuit').click();
  ok(P.routine.state().active === false && q('#routineBar').hidden === true, '진행 바 ✕로 루틴 그만두기');
  ok((txt('#toast') || '').indexOf('그만뒀어요') !== -1, '그만두기 토스트 (' + txt('#toast') + ')');

  /* 편집 · 지우기 */
  P.routine.quit(true);
  P.openMenu('routine');
  q('#routineCustomBox [data-act="edit"]').click();
  ok(q('#routineEditor').hidden === false && q('#routineDraft').querySelectorAll('li').length === 2, '편집 → 저장된 2개를 불러옴');
  ok(q('#routineName').value === '테스트 루틴', '이름도 불러옴 (' + q('#routineName').value + ')');
  q('#routineEditorClose').click();
  ok(q('#routineEditor').hidden === true && !!q('#routineDraft li.dEmpty'), '취소 → 편집기 닫고 초안 비움');
  const delBtn = q('#routineCustomBox [data-act="delete"]');
  delBtn.click();
  ok(delBtn.textContent === '정말 지울까요?', '지우기 한 번 → 확인 문구');
  delBtn.click();
  ok(P.routine.readCustom() === null && (q('#routineCustomBox').textContent || '').indexOf('아직 없어요') !== -1,
     '두 번째 클릭에 나만의 루틴 삭제');

  /* 이상한 값 방어 */
  ok(P.routine.cleanSteps([{ ex: 'nope', goal: 5 }, { ex: 'squat', goal: 0 }, { ex: 'squat', goal: 10, rest: 99 }]).length === 1,
     '없는 운동·0 목표는 걸러냄');
  ok(P.routine.cleanSteps([{ ex: 'plank', goal: 30, rest: 0 }])[0].rest === 0, '마지막 운동의 휴식 0은 그대로');
  ok(P.routine.cleanSteps(new Array(12).fill({ ex: 'squat', goal: 10, rest: 45 })).length === 8, '운동은 8개까지만 저장');
  ok(P.routine.start({ name: '빈 루틴', steps: [] }) === false, '운동이 없는 루틴은 시작하지 않음');
  ok(P.routine.state().active === false, '마무리: 진행 중인 루틴 없음');
  P.closeMenu();
  P.routine.clearCustom();
  say('');

  /* ---------- 10) 콘솔 에러 ---------- */
  say('▸ 10. 에러 확인');
  const real = errors.filter(function(e){ return e && e.indexOf('ResizeObserver') === -1; });
  ok(real.length === 0, '앱에서 발생한 JS 에러 0건' + (real.length ? ' → ' + real.join(' | ') : ''));
  const collected = (app.__prehealthErrors || []).filter(function(e){ return String(e).indexOf('ResizeObserver') === -1; });
  ok(collected.length === 0, '앱 자체 오류 수집기도 0건' + (collected.length ? ' → ' + collected.join(' | ') : ''));

  /* 테스트가 남긴 기록 정리 */
  P.clearRecords();
  P.closePro();
  P.closeCardModal();
  done();
})();
</script>
</body>
</html>
